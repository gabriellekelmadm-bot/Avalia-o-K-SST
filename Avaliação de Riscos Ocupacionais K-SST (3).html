razos no plano de ação fica a critério do empregador ou, dependendo de sua especificidade, existe prazo máximo para a sua execução? A NR 01 não estabelece prazos para execução das medidas do plano de ação. Dentro do plano de ação, deve ser definido cronograma de implantação das medidas de prevenção, levando em consideração o nível de risco ocupacional (baixo, médio e alto, por exemplo) e o atendimento às exigências previstas em normas regulamentadoras e nos dispositivos legais. Vale lembrar, contudo, que, quando da identificação de grave e iminente risco, as ações de medidas de prevenção devem ser adotadas imediatamente. De acordo com o item 3.2.1 da NR 03: “Considera-se grave e iminente risco toda"],[53,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho condição ou situação de trabalho que possa causar acidente ou doença com lesão grave ao trabalhador.” 1.5.4.4.5 Após a avaliação, os riscos ocupacionais devem ser classificados, observado o subitem 1.5.4.4.2, para fins de identificar a necessidade de adoção de medidas de prevenção e elaboração do plano de ação. 1.5.4.4.2 Para cada risco deve ser indicado o nível de risco ocupacional, determinado pela combinação da severidade das possíveis lesões ou agravos à saúde com a probabilidade ou chance de sua ocorrência. 70. Que providência formal uma organização dispensada de elaborar PGR deve adotar?"],[53,"Como regra geral, somente as ME e EPP, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos devem declarar as informações digitais na forma do item 1.6.1. 1.6.1 As organizações devem prestar informações de segurança e saúde no trabalho em formato digital, conforme modelo aprovado pela STRAB, ouvida a SIT. A Portaria SEPRT/ME nº 6.730, de 2020, que aprovou a nova redação da NR 01, estabeleceu que, transitoriamente, isto é, até que o sistema informatizado referido no item 1.6.1 fosse disponibilizado, o empregador deveria manter no"],[54,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho estabelecimento uma declaração da inexistência de riscos, sem a qual não faria jus ao tratamento diferenciado: Art. 3° Estabelecer que, enquanto não houver sistema informatizado para o recebimento da declaração de informações digitais prevista nos subitens 1.8.4 e 1.8.6 do Anexo I desta Portaria, o empregador deverá manter declaração de inexistência de riscos no estabelecimento para fazer jus ao tratamento diferenciado. O sistema foi disponibilizado em 28 de abril de 2022 no endereço https://pgr.trabalho.gov.br . 71.Quem pode elaborar a declaração de inexistência de riscos químicos, físicos e biológicos?"],[54,"A NR 01 apenas menciona que o empregador é o responsável pela prestação das informações de inexistência dos riscos. 1.8.8 O empregador é o responsável pela prestação das informações previstas nos subitens 1.8.4 e 1.8.6. No entanto, é necessário conhecimento técnico para a correta prestação das referidas informações, sendo recomendável que o empregador seja orientado por profissional competente. 72. O que acontece se a empresa apresentar declaração de inexistência de riscos não condizente com a realidade do ambiente de trabalho? A empresa que apresentar declaração de inexistência de riscos não condizente com a realidade do ambiente de trabalho estará sujeita à autuação pela Inspeção do Trabalho."],[55,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 73. As empresas que não têm obrigatoriedade de apresentar o PGR são as mesmas que estão dispensadas de elaborar o PCMSO? Não. A dispensa de elaboração do PCMSO apresenta algumas diferenças em relação à dispensa de elaboração do PGR. Além da diferença no que diz respeito ao MEI, que sempre está dispensado de elaborar o PGR (item 1.8.1), há ainda a consideração dos riscos relativos aos fatores ergonômicos. Para que as empresas sejam dispensadas de elaborar o PCMSO, além de cumprirem os requisitos do item 1.8.4, também não poderão ter identificado riscos relacionados a fatores ergonômicos nos seus processos de trabalho."],[55,"1.8.1 O Microempreendedor Individual - MEI está dispensado de elaborar o PGR 1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR. 1.8.6 O MEI, a ME e a EPP, graus de risco 1 e 2, que declararem as informações digitais na forma do subitem 1.6.1 e não identificarem exposições ocupacionais a agentes físicos, químicos, biológicos e riscos relacionados a fatores ergonômicos, ficam dispensados de elaboração do Programa de Controle Médico de Saúde Ocupacional – PCMSO."],[56,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 74. A empresa contratada fica dispensada de elaborar PGR próprio se o PGR da empresa contratante incluir as medidas de prevenção para as contratadas?"],[56,"Nos termos da NR 01, apenas o MEI, a ME e a EPP possuem tratamento diferenciado (dispensa) quanto à elaboração do PGR, nos termos da NR 01. No caso da ME e EPP, desde que cumpram os requisitos do item 1.8.4. O item 1.5.8.2 informa que o PGR da empresa contratante pode incluir as medidas de prevenção para as empresas contratadas para prestação de serviços que atuem em suas dependências ou local previamente convencionado em contrato ou o PGR pode referenciar os programas das contratadas. A contratada não precisa apresentar o PGR completo à sua contratante, porém deve fornecer ao contratante o inventário de riscos ocupacionais específicos daquelas atividades realizadas nas dependências da contratante ou em local previamente convencionado em contrato. Os controles já existentes e implementados são considerados na fase de classificação do risco, que consta no inventário."],[56,"75. Uma empresa enquadrada na dispensa prevista no item 1.8.4 da NR 01 (inexistência de riscos), mas que esteja situada no entorno de empresas com potencial de acidentes ampliados (perigo externo) deve elaborar o PGR?"],[56,"As empresas contempladas com tratamento diferenciado dos itens 1.8.1 e 1.8.4 não têm obrigatoriedade em elaborar o PGR em função do perigo externo, uma vez que o gerenciamento de riscos ocupacionais deve ser implementado por estabelecimento e com relação às atividades desenvolvidas pela empresa. Os perigos existentes no entorno do estabelecimento, que podem afetar toda organização, são tratados como acidentes industriais maiores ou acidentes ampliados. A Convenção nº 174 da OIT trata da “prevenção de acidentes industriais maiores” e estabelece o seguinte conceito de acidente ampliado:"],[56,"“Todo evento inesperado, como uma emissão, um incêndio ou uma explosão de grande magnitude, envolvendo uma ou mais substâncias perigosas e que exponha aos trabalhadores, a população ou o meio ambiente a perigo de consequências imediatas ou de médio e longo prazos.”"],[57,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Portanto, cabe à organização identificar esses perigos externos previsíveis relacionados ao entorno da organização e trabalhar na redução das consequências e severidade de um acidente maior no local de trabalho, desencadeando ações de resposta de emergências, ou até mesmo, o distanciamento adequado. Esses processos variam consideravelmente de empresa para empresa, desde simples avaliações até análises complexas com grandes volumes de documentos. Cabe à organização planejar esses processos conforme suas necessidades, as situações encontradas no ambiente de trabalho, e ficar em conformidade com os requisitos legais."],[57,"76. No caso de uma empresa enquadrada na dispensa prevista no item 1.8.4 da NR 01 (inexistência de riscos), mas que possua riscos relacionados a fatores ergonômicos, como deve ser realizado o monitoramento ergonômico dos trabalhadores?"],[57,"O item 1.8.4 da NR 01 prevê dispensa quanto à elaboração do PGR. Adicionalmente, conforme consta no item 1.8.5, a dispensa prevista na NR 01 é aplicável apenas quanto à elaboração do PGR e não afasta a obrigação de cumprimento por parte do MEI, ME e EPP das demais disposições previstas em NR. Na situação ilustrada no questionamento, embora essas empresas estejam dispensadas da elaboração do PGR, elas devem cumprir o disposto na Norma Regulamentadora nº 17 (NR 17), que determina que a organização deve realizar a Avaliação Ergonômica Preliminar (AEP), a qual será contemplada na etapa do processo de identificação de perigos. Constatando-se, nesse caso, as situações previstas nas alíneas “c” e “d” do item 17.3.2 da NR 17, tais empresas deverão realizar a Análise Ergonômica do Trabalho (AET)."],[57,"17.3.4 As Microempresas – ME e Empresas de Pequeno Porte – EPP enquadradas como graus de risco 1 e 2 e o Microempreendedor Individual – MEI não são obrigados a elaborar a AET, mas devem atender todos os demais requisitos estabelecidos nesta NR, quando aplicáveis."],[58,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 17.3.4.1 As ME ou EPP enquadradas como graus de risco 1 e 2 devem realizar a AET quando observadas as situações previstas nas alíneas “c” e “d” do item 17.3.2. 17.3.2 A organização deve realizar Análise Ergonômica do Trabalho - AET da situação de trabalho quando: a) observada a necessidade de uma avaliação mais aprofundada da situação; b) identificadas inadequações ou insuficiência das ações adotadas; c) sugerida pelo acompanhamento de saúde dos trabalhadores, nos termos do Programa de Controle Médico de Saúde Ocupacional - PCMSO e da alínea “c” do subitem 1.5.5.1.1 da NR 01; ou"],[58,"d) indicada causa relacionada às condições de trabalho na análise de acidentes e doenças relacionadas ao trabalho, nos termos do Programa de Gerenciamento de Riscos – PGR. Ainda no caso em tela, embora a empresa estivesse desincumbida da elaboração do PGR, não estaria isenta da elaboração do PCMSO, visto que, por força do item 1.8.6 da NR 01, a existência dos riscos relacionados a fatores ergonômicos a obrigaria a elaborar esse documento, configurando, então, uma forma de acompanhamento dos trabalhadores expostos. 77. No caso de dispensa de elaboração de PGR, a empresa fará o levantamento de perigos ergonômicos e de acidentes, mas não fará a gestão desses perigos?"],[58,"A dispensa prevista no item 1.8.4 da NR 01 refere-se exclusivamente à elaboração do PGR. Portanto, as organizações dispensadas desse requisito permanecem obrigadas a implementar as ações de gerenciamento de riscos ocupacionais em seus estabelecimentos. Todos os riscos identificados devem ser geridos/controlados por meio de adoção de medidas de prevenção. É dever da organização implementar, por estabelecimento, o gerenciamento de riscos ocupacionais em suas atividades. A fase de levantamento preliminar de perigos faz parte do gerenciamento de riscos ocupacionais, devendo ser seguida das etapas de avaliação dos riscos e controle dos riscos (medidas de prevenção)."],[59,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 1.5.5.1.1 A organização deve adotar medidas de prevenção para eliminar, reduzir ou controlar os riscos sempre que: a) exigências previstas em Normas Regulamentadoras e nos dispositivos legais determinarem; b) a classificação dos riscos ocupacionais assim determinar, conforme subitem 1.5.4.4.5; c) houver evidências de associação, por meio do controle médico da saúde, entre as lesões e os agravos à saúde dos trabalhadores com os riscos e as situações de trabalho identificados. 1.5.5.2.1 A organização deve elaborar plano de ação, indicando as medidas de prevenção a serem introduzidas, aprimoradas ou mantidas, conforme o subitem 1.5.4.4.5."],[59,"78. Empresas enquadradas na dispensa prevista no item 1.8.4 da NR 01 (inexistência de riscos físicos, químicos e biológicos) não deveriam elaborar pelo menos o inventário dos riscos vez que podem estar sujeitas a outros riscos ocupacionais (tais como riscos de incêndio, choque elétrico e queda de altura)? O item 1.8.4 da NR 01 prevê dispensa quanto à elaboração do PGR: 1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR."],[59,"Para que a referida dispensa se aplique, além da inexistência dos riscos da higiene ocupacional, é preciso que a empresa seja ME ou EPP e, simultaneamente, sua atividade seja enquadrada como grau de risco 1 ou 2. Adicionalmente, conforme consta no item 1.8.5, a dispensa prevista na NR 01 é aplicável apenas quanto à elaboração do PGR e não afasta a obrigação de"],[60,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho cumprimento por parte do MEI, ME e EPP das demais disposições previstas em NR: 1.8.5 A dispensa prevista nesta Norma é aplicável quanto à obrigação de elaboração do PGR e não afasta a obrigação de cumprimento por parte do MEI, ME e EPP das demais disposições previstas em NR. Assim, todas as organizações, inclusive as dispensadas do PGR, devem fazer o gerenciamento do risco ocupacional do seu estabelecimento, sendo que faz parte deste gerenciamento o levantamento preliminar de perigos. Portanto, essas empresas ainda devem cumprir a NR 23, a NR 10, a NR 35 e as demais."],[60,"79. Como realizar o acompanhamento médico de trabalhadores em empresas dispensadas de elaborar o PCMSO? Da mesma forma que a dispensa de elaboração de PGR não desobriga a empresa de realizar o gerenciamento do risco ocupacional em seu estabelecimento (item 1.8.5), a dispensa da elaboração do PCMSO não desobriga a empresa de realizar o acompanhamento da saúde dos trabalhadores pela realização dos exames médicos que se fizerem necessários: 1.8.6.1 A dispensa do PCMSO não desobriga a empresa da realização dos exames médicos e emissão do Atestado de Saúde Ocupacional - ASO."],[60,"Portanto, a leitura combinada dos itens 1.8.5 e 1.8.6.1 permite concluir que, mesmo que uma empresa esteja dispensada da elaboração e implementação do PCMSO, por não apresentar riscos físicos, químicos, biológicos e aqueles relacionados a fatores ergonômicos, não fica desobrigada de cumprir as demais NR. Portanto, deve cumprir o item 7.5.7 da NR 07: 7.5.7 Os exames médicos de que trata o subitem 7.5.6 compreendem exame clínico e exames complementares, realizados de acordo com as especificações desta e de outras NR. 7.5.6 O PCMSO deve incluir a realização obrigatória dos exames médicos: a) admissional;"],[61,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho b) periódico; c) de retorno ao trabalho; d) de mudança de riscos ocupacionais; e) demissional. 80. De quem é a responsabilidade quanto às medidas de prevenção: do contratante ou da contratada? E de quem é a responsabilidade sobre os riscos referentes à atividade?"],[61,"Ao classificar os riscos ocupacionais, a contratada determina a necessidade de adoção de medidas de prevenção, nos termos do item 1.5.3.2, alínea “d”, da NR 01. Essas medidas estão estabelecidas em seu inventário, são de sua responsabilidade, portanto. Quando a atividade é desenvolvida no estabelecimento da contratante, esta deve informar à contratada os riscos existentes sob sua gestão para que a contratada possa realizar a avaliação dos riscos de seus empregados naquele ambiente: 1.5.8.3 As organizações contratantes devem fornecer às contratadas informações sobre os riscos ocupacionais sob sua gestão e que possam impactar nas atividades das contratadas."],[61,"À contratada incumbe, ainda, fornecer o inventário de riscos ocupacionais à contratante (item 1.5.8.4 da NR 01), que tem o dever de analisá-lo, já que é sua responsabilidade garantir as condições de segurança, higiene e salubridade dos trabalhadores da contratada, nos termos do art. 5º-A, §3º, da Lei nº 6.019, de 3 de janeiro de 1974, com a redação conferida pela Lei nº 13.429, de 31 de março de 2017 (Lei da Terceirização):"],[62,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho §3° É responsabilidade da contratante garantir as condições de segurança, higiene e salubridade dos trabalhadores, quando o trabalho for realizado em suas dependências ou local previamente convencionado em contrato. 81. As empresas de prestação de serviços em geral (ex. serviços de limpeza) devem fazer um PGR para cada empresa contratante?"],[62,"Não. A contratada não precisa fazer um PGR para cada empresa contratante. A prestadora de serviço deve fornecer ao contratante o inventário de riscos ocupacionais específicos das atividades que serão realizadas conforme convencionado em contrato. Portanto, se um contratante demanda uma forma especial de execução das atividades de limpeza, com produtos químicos específicos, por exemplo, o inventário deve considerar essas circunstâncias e estabelecer os controles adequados. 1.5.8.4 As organizações contratadas devem fornecer ao contratante o Inventário de Riscos Ocupacionais específicos de suas atividades que são realizadas nas dependências da contratante ou local previamente convencionado em contrato."],[62,"82. Uma terceirizada que irá realizar serviços de escavação por um período curto, de mais ou menos 45 dias, precisará apresentar o inventário de riscos para a contratante? Sim, uma vez que o item 18.4.1 da NR 18 informa que são obrigatórias a elaboração e a implementação do PGR nos canteiros de obras. A elaboração do PGR não está vinculada ao tempo dispendido na obra, e sim, ao gerenciamento dos riscos ocupacionais das atividades desenvolvidas nessa obra durante a execução dos serviços. A atividade de escavação apresenta diversos perigos, entre os quais se destaca o de acidente por aprisionamento (soterramento), o qual deve ser controlado adequadamente na etapa de classificação, no inventário de riscos ocupacionais."],[63,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 18.4.4 As empresas contratadas devem fornecer ao contratante o inventário de riscos ocupacionais específicos de suas atividades, o qual deve ser contemplado no PGR do canteiro de obras. 83. As empresas terceirizadas devem elaborar inventário de riscos contemplando cada atividade que seja objeto do contrato? A empresa contratante tem o dever de abordar esses riscos em seu PGR? A terceirizada/contratada deve fornecer ao contratante o inventário de riscos ocupacionais específicos daquelas atividades que serão realizadas nas dependências da contratante ou local previamente convencionado em contrato."],[63,"1.5.8.4 As organizações contratadas devem fornecer ao contratante o Inventário de Riscos Ocupacionais específicos de suas atividades que são realizadas nas dependências da contratante ou local previamente convencionado em contrato Faculta-se à contratante a inclusão, em seu PGR, das medidas de prevenção a serem implementadas pelas contratadas, ou a referenciação aos programas das contratadas, conforme o disposto abaixo: 1.5.8.2 O PGR da empresa contratante poderá incluir as medidas de prevenção para as empresas contratadas para prestação de serviços que atuem em suas dependências ou local previamente convencionado em contrato ou referenciar os programas das contratadas. 84. Empresa terceirizada com 1 (um) funcionário tem que realizar o gerenciamento de risco ocupacional e elaborar o PGR?"],[63,"Todas as organizações devem gerenciar o risco ocupacional do seu estabelecimento (item 1.5.3.1 da NR 01), sendo etapa integrante desse gerenciamento o levantamento preliminar de perigos, quando as exposições são ou não identificadas. A dispensa estipulada na NR 01 quanto ao PGR (item 1.8.4) restringe-se unicamente à sua elaboração, não afastando a obrigação de cumprimento por"],[64,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho parte do MEI, ME e EPP das demais disposições previstas em NR, conforme o item 1.8.5. 1.5.3.1. A organização deve implementar, por estabelecimento, o gerenciamento de riscos ocupacionais em suas atividades. 1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR."],[64,"1.8.5 A dispensa prevista nesta Norma é aplicável quanto à obrigação de elaboração do PGR e não afasta a obrigação de cumprimento por parte do MEI, ME e EPP das demais disposições previstas em NR. No caso concreto, deve-se observar se essa empresa com apenas 1 empregado está enquadrada na dispensa prevista na NR 01 quanto à obrigação de elaboração do PGR. Caso a empresa não esteja dispensada, conforme os itens 1.8.1 e 1.8.4, deverá elaborar e implementar o PGR, uma vez que a norma não estabelece critério mínimo de quantidade de funcionários para o cumprimento desta obrigatoriedade."],[64,"85. Obra iniciada em 2021, com a contratação, em 2022, de empresa terceirizada para realização de atividades construtivas: nesse caso, basta solicitar o PGR da empresa contratada ou é necessário fazer o PGR para abranger a contratada? A empresa que iniciou a obra em 2021 e constituiu o PCMAT não está obrigada a elaborar o PGR (item 18.17.1 da NR 18), porém precisará solicitar o inventário de riscos da empresa contratada, nos termos do item 1.5.8.4 da NR 01, uma vez que esse contrato foi firmado após a entrada em vigor da NR 18 e da NR 01, em 3 de janeiro de 2022 (conforme estabelecido pela Portaria SEPRT/ME nº 8.873, de 23 de julho de 2021)."],[65,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 18.17.1 O Programa de Condições e Meio Ambiente de Trabalho da indústria da construção (PCMAT) existente antes da entrada em vigência desta Norma terá validade até o término da obra a que se refere. Além disso, a contratante deve fornecer à contratada informações sobre os riscos ocupacionais sob sua gestão e que possam impactar nas atividades das contratadas, nos termos do item 1.5.8.3 da NR 01. 86. Como fica a realização de exames quando o PGR da contratante abrange risco originalmente inexistente na contratada (ex. ruído)? A contratada precisará fazer exames referente ao PCMSO da contratante?"],[65,"A organização contratante deve fornecer às contratadas informações sobre os riscos ocupacionais sob sua gestão e que possam impactar nas atividades das contratadas. As organizações contratadas devem realizar o levantamento preliminar de perigos, instituindo medidas de prevenção adequadas e ajustando seu controle de saúde ocupacional, promovendo exames médicos e complementares em virtude da exposição de seus empregados aos riscos ocupacionais existentes nas dependências da contratante ou local estabelecido contratualmente. Uma contratada dispensada de elaborar PCMSO terá que proceder à sua elaboração e implementação se os riscos sob gestão da contratante alcançarem seus empregados"],[65,"87. Caso uma ME ou uma EPP dispensada de elaborar PGR venha a atuar como contratada em um local que possua risco físico, químico ou biológico, deverá gerenciar os riscos a que os seus empregados estarão expostos no ambiente da contratante, constituindo e implementando um PGR? Sim. O processo de gerenciamento de riscos ocupacionais é dinâmico. Uma ME ou EPP pode estar dispensada de elaborar o PGR, nos termos do item 1.8.4 da NR 01, em determinado contexto quando não tenha identificado exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR"],[66,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 09, em seu levantamento preliminar de perigos, consideradas as atividades existentes em seu estabelecimento naquele momento. 1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR."],[66,"Entretanto, se a organização contratante lhe fornece informações sobre os riscos ocupacionais sob gestão daquela e que tenham o potencial de impactar nas atividades das contratadas, a ME ou a EPP em questão deve realizar uma nova rodada de gestão de riscos ocupacionais: 1.5.8.3 As organizações contratantes devem fornecer às contratadas informações sobre os riscos ocupacionais sob sua gestão e que possam impactar nas atividades das contratadas. Para tanto, deve adotar o procedimento previsto na alínea “c” do item 1.5.4.2.1 da NR 01, em face da introdução de novos processos ou atividades de trabalho: 1.5.4.2.1 O levantamento preliminar de perigos deve ser realizado: a) antes do início do funcionamento do estabelecimento ou novas instalações; b) para as atividades existentes; e"],[66,"c) nas mudanças e introdução de novos processos ou atividades de trabalho"],[67,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 88. Posso manter o Programa de Prevenção de Riscos Ambientais (PPRA) em substituição ao PGR? As organizações não podem manter o PPRA em substituição ao PGR, devendo, necessariamente, sistematizar suas informações de segurança e saúde no trabalho no PGR. Essa é a inteligência dos subitens 1.5.3.1 e 1.5.3.1.1 da nova NR 01: 1.5.3.1 A organização deve implementar, por estabelecimento, o gerenciamento de riscos ocupacionais em suas atividades. 1.5.3.1.1 O gerenciamento de riscos ocupacionais deve constituir um Programa de Gerenciamento de Riscos - PGR."],[67,"A nova redação da NR 09, publicada pela Portaria SEPRT/ME nº 6.735, de 2020, não prevê mais o programa chamado PPRA. A partir de 3 de janeiro de 2022, a NR 09 passou a ter uma função acessória ao gerenciamento de determinados riscos, nos termos do item 9.1.1: 9.1.1 Esta Norma Regulamentadora - NR estabelece os requisitos para a avaliação das exposições ocupacionais a agentes físicos, químicos e biológicos quando identificados no Programa de Gerenciamento de Riscos - PGR, previsto na NR-1, e subsidiá-lo quanto às medidas de prevenção para os riscos ocupacionais. 89. Quais as principais diferenças entre o PPRA e o PGR?"],[67,"O PPRA considerava como riscos ocupacionais apenas os riscos ambientais, ou seja, os agentes físicos, químicos e biológicos existentes nos ambientes de trabalho que, em função de sua natureza, concentração ou intensidade e tempo de exposição, são capazes de causar danos à saúde do trabalhador. Já o gerenciamento de riscos ocupacionais alcança todos os perigos e consequentes riscos ocupacionais existentes na organização, como os relacionados aos agentes físicos, químicos e biológicos, aos fatores ergonômicos e aos riscos de acidentes (choque elétrico, queda de altura, superfície escorregadia,"],[68,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho aqueles relacionados a uso de ferramentas e materiais, etc.), além de estabelecer a sistematização dos processos de identificação de perigos, avaliação e controle dos riscos ocupacionais articulada com ações de saúde, análise de acidentes e de preparação para resposta a emergências, dentre outros requisitos legais. Os processos obrigatórios do gerenciamento de riscos ocupacionais são materializados no documento denominado PGR, composto, no mínimo, pelo inventário de riscos ocupacionais e pelo plano de ação, que são construídos a partir dos registros destes processos. 90. Como fica aquele PPRA em andamento na data da entrada em vigor do PGR?"],[68,"O PPRA não é mais válido e os agentes físicos, químicos e biológicos e as medidas de prevenção desse PPRA devem migrar para o PGR, junto com TODOS OS PERIGOS existentes na organização. A partir de 3 de janeiro de 2022, todas as organizações devem estar com o seu processo de gerenciamento de riscos implementado e seu respectivo PGR - que substituiu o PPRA - elaborado, podendo utilizar as informações produzidas pelo PPRA no que tange aos riscos físicos, químicos e biológicos, mas não se limitando a esses. 91. Se uma empresa tem um PPRA elaborado em outubro de 2020, qual o prazo deste e a partir de quando a empresa deverá gerar o PGR?"],[68,"Esse PPRA teve validade somente até 2 de janeiro de 2022, pois, a partir dessa data, a exigência legal existente é de desenvolvimento e implementação do PGR. Além disto, a nova redação da NR 09, publicada pela Portaria SEPRT/ME nº 6.735, de 2020, não prevê mais o programa chamado PPRA, passando a estabelecer, a partir de 3 de janeiro de 2022: 9.1.1 Esta Norma Regulamentadora - NR estabelece os requisitos para a avaliação das exposições ocupacionais a agentes físicos, químicos e biológicos quando identificados no Programa de Gerenciamento de Riscos - PGR, previsto na NR-1, e subsidiá-lo quanto às medidas de prevenção para os riscos ocupacionais."],[69,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 92. O que foi o período de transição do PPRA para o PGR?"],[69,"Entre a publicação (9 de março de 2020) e o início da vigência (3 de janeiro de 2022) da nova NR 01, ainda estava em vigência o texto da antiga NR 09 que disciplinava o PPRA. Nesse interregno, as empresas deveriam ter dado início à atualização de seus sistemas de gestão de forma a compreender o gerenciamento de todos os riscos ocupacionais, conforme comandado pelo capítulo 1.5 da nova redação da NR 01. A partir de 3 de janeiro de 2022, o PGR da organização já tem que contemplar todos os riscos ocupacionais, não apenas os químicos, físicos e biológicos de que o PPRA cuidava, e propor um plano de ação para efetiva prevenção de agravos e acidentes. 93. Como fazer a transição do PPRA para o PGR?"],[69,"Dados já existentes do PPRA podem ser aproveitados para a elaboração do PGR, desde que atendidas as etapas previstas no item 1.5.3.2 da NR 01 e observada a nova metodologia prevista nessa norma. Os esclarecimentos acerca da transição do PPRA para o PGR encontram-se detalhados na Nota Técnica SEI nº 51363/2021/ME, elaborada pela Subsecretaria de Inspeção do Trabalho (SIT) da Secretaria de Trabalho (STRAB) do Ministério do Trabalho e Previdência (MTP). O documento encontra-se disponível em https://www.gov.br/trabalho-e-previdencia/pt-br/composicao/orgaos-especificos/secretaria-de- trabalho/inspecao/seguranca-e-saude-no-trabalho/sst-notas-tecnicas/sei_me-19774091-nota- tecnica.pdf . 94. Posso dar fim aos PPRA da empresa?"],[69,"Não. O PPRA pode ser solicitado em fiscalização que diga respeito a fatos ocorridos no passado, de que são exemplos os acidentes de trabalho. 95. Os PPRA anteriores da empresa podem ser solicitados pela fiscalização do trabalho mesmo com a vigência do PGR?"],[70,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Sim. Por força da redação anterior da NR 09 (Portaria SSST nº 25, de 29 de dezembro de 1994), o PPRA deve ser guardado por 20 anos para comprovação da vida laboral do trabalhador. Essa guarda é necessária, inclusive, para fazer um acompanhamento da gestão de SST da empresa. 1.6.3 Os documentos físicos, assinados manualmente, inclusive os anteriores à vigência desta NR, podem ser arquivados em meio digital, pelo período correspondente exigido pela legislação própria, mediante processo de digitalização conforme disposto em Lei. 96. Devo guardar os documentos físicos do PPRA por 20 anos?"],[70,"A guarda do PPRA deve ser por 20 anos, conforme redação anterior da NR 09 (Portaria SSST nº 25, de 1994). Os documentos, contudo, podem ser arquivados em meio digital, conforme item 1.6.3 da NR 01. 1.6.3 Os documentos físicos, assinados manualmente, inclusive os anteriores à vigência desta NR, podem ser arquivados em meio digital, pelo período correspondente exigido pela legislação própria, mediante processo de digitalização conforme disposto em Lei. 1.6.3.1 O processo de digitalização deve ser realizado de forma a manter a integridade, a autenticidade e, se necessário, a confidencialidade do documento digital, com o emprego de certificado digital emitido no âmbito da Infraestrutura de Chaves Públicas Brasileira (ICP-Brasil)."],[70,"1.6.3.2 Os empregadores que optarem pela guarda de documentos prevista no caput devem manter os originais conforme previsão em lei. Nesse caso, conforme previsto no item 1.6.4, o empregador deve garantir a preservação de todos os documentos nato digitais ou digitalizados por meio de procedimentos e tecnologias que permitam verificar, a qualquer tempo, sua validade jurídica em todo território nacional, garantindo permanentemente sua autenticidade, integridade, disponibilidade, rastreabilidade, irretratabilidade, privacidade e interoperabilidade."],[71,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 97. Como elaborar o Programa de Controle Médico de Saúde Ocupacional (PCMSO) quando dispensada a elaboração do PGR nos termos da NR 01? O médico responsável pelo PCMSO pode utilizar o levantamento preliminar de perigos realizado pela organização. Independentemente da dispensa de elaboração do PGR, todas as organizações devem realizar o gerenciamento dos riscos ocupacionais do seu estabelecimento, sendo que faz parte deste gerenciamento o levantamento preliminar de perigos."],[71,"1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR. 98. O PCMSO emitido com base no PPRA gerado antes do PGR terá validade? Não. A nova redação da NR 07, publicada pela Portaria SEPRT/ME nº 6.734, de 09 de março de 2020, não prevê mais o programa chamado PPRA, passando a estabelecer, desde 3 de janeiro de 2022 (Portaria SEPRT/ME nº 8.873, de 2021): 7.5.1 O PCMSO deve ser elaborado considerando os riscos ocupacionais identificados e classificados pelo PGR."],[71,"Além do disposto, a nova NR 07 traz exigências distintas daquelas praticadas à luz da redação antiga, sendo necessário que os programas atuais atendam a essas novas exigências."],[72,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Acrescenta-se ainda que, com o início da vigência das disposições sobre gerenciamento de riscos ocupacionais da nova NR 01 (a partir de 3 de janeiro de 2022), o próprio PPRA deve dar lugar ao PGR. 99. Se surgir um novo risco que demande exame complementar, o PCMSO também tem que ser atualizado de imediato, ou basta informação posterior no relatório analítico anual?"],[72,"Sim, o PCMSO, por se tratar de um programa, deverá ser atualizado quando houver um novo risco que importe agravo ou lesão à saúde do trabalhador. Um exame complementar é exigível sempre que contemplado nos anexos da NR 07. Ainda, quando tenha sido relacionado aos riscos ocupacionais classificados no PGR e tecnicamente justificado pelo médico responsável pelo PCMSO. 7.5.4 A organização deve garantir que o PCMSO: b) contenha planejamento de exames médicos clínicos e complementares necessários, conforme os riscos ocupacionais identificados, atendendo ao determinado nos Anexos desta NR; 7.5.18 Podem ser realizados outros exames complementares, a critério do médico responsável, desde que relacionados aos riscos ocupacionais classificados no PGR e tecnicamente justificados no PCMSO."],[72,"Vale relembrar que o PGR deve ser um processo contínuo, a ser revisto a cada 2 (dois) anos (em organizações que não tiverem alterações no inventário de risco durante este período), ou quando da ocorrência das situações previstas no item 1.5.4.4.6 da NR 01. 100. O plano de ação do PCMSO pode estar vinculado com o do PGR? O plano de ação do PGR indica as medidas de prevenção a serem introduzidas, aprimoradas ou mantidas, possui cronograma e estabelece formas de acompanhamento e aferição de resultados. O PGR consolida documentalmente a gestão do risco ocupacional. Já o PCMSO consolida as diretrizes e condutas a fim de promover o controle médico da população trabalhadora de uma empresa. O PCMSO deve ser"],[73,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho elaborado considerando os riscos ocupacionais identificados e classificados pelo PGR e tem a finalidade de prevenção primária mediante a promoção de ações de saúde, o que é obtido mediante o emprego de estratégias de vigilância ativa e passiva. As ações planejadas para o PGR e para o PCMSO não se confundem, embora os resultados de um programa retroalimentem o outro."],[73,"7.1.1 Esta Norma Regulamentadora - NR estabelece diretrizes e requisitos para o desenvolvimento do Programa de Controle Médico de Saúde Ocupacional - PCMSO nas organizações, com o objetivo de proteger e preservar a saúde de seus empregados em relação aos riscos ocupacionais, conforme avaliação de riscos do Programa de Gerenciamento de Risco - PGR da organização. 101. Os treinamentos de SST podem ficar no plano de ação como recomendação? Em qual momento o treinamento deve ser realizado?"],[73,"Caso o treinamento já tenha sido realizado, deve estar presente no inventário de risco, por se tratar de medida administrativa já implementada. Se ainda irá ser ministrado, deverá constar no plano de ação, com data prevista para realização. Conforme consta no item 1.7.1.2 da NR 01, a capacitação deve incluir: a) treinamento inicial: deverá ocorrer antes de o trabalhador iniciar suas funções ou de acordo com o prazo especificado em NR. b) treinamento periódico: deverá ocorrer de acordo com periodicidade estabelecida nas NR ou, quando não estabelecido, em prazo determinado pelo empregador. c) treinamento eventual: deverá ocorrer de acordo com as alíneas do item 1.7.1.2.3:"],[74,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 1.7.1.2.3 O treinamento eventual deve ocorrer: a) quando houver mudança nos procedimentos, condições ou operações de trabalho, que impliquem em alteração dos riscos ocupacionais; b) na ocorrência de acidente grave ou fatal, que indique a necessidade de novo treinamento; ou c) após retorno de afastamento ao trabalho por período superior a 180 (cento e oitenta) dias. 102. O que significa o aproveitamento de treinamentos entre organizações? A NR 01 traz a possibilidade de que treinamentos realizados pelo trabalhador em outras organizações sejam avaliados, convalidados ou complementados, total ou parcialmente, pela organização atual que o emprega:"],[74,"1.7.7 Os treinamentos realizados pelo trabalhador podem ser avaliados pela organização e convalidados ou complementados Para que esse aproveitamento possa ser realizado, o item 1.7.7.1. estabelece os requisitos a serem considerados pela organização. Assim, a organização deve analisar as atividades desenvolvidas na organização anterior, comparar com as atividades que irá desempenhar na organização; verificar se o conteúdo e a carga horária cumpridos estão de acordo com os exigidos e, por fim, observar a data do treinamento convalidado ou complementado. 1.7.7.1 A convalidação ou complementação deve considerar: a) as atividades desenvolvidas pelo trabalhador na organização anterior, quando for o caso; b) as atividades que desempenhará na organização; c) o conteúdo e carga horária cumpridos;"],[75,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho d) o conteúdo e carga horária exigidos; e e) que o último treinamento tenha sido realizado em período inferior ao estabelecido na NR ou há menos de 2 (dois) anos, nos casos em que não haja prazo estabelecido em NR. Por fim, se optar por aproveitar os treinamentos anteriores do trabalhador, total ou parcialmente, a organização deve emitir a certificação da capacitação do trabalhador, devendo mencionar nesse certificado a data da realização dos treinamentos que foram convalidados ou complementados."],[75,"1.7.8 O aproveitamento de treinamentos anteriores, total ou parcialmente, não exclui a responsabilidade da organização de emitir a certificação da capacitação do trabalhador, devendo mencionar no certificado a data da realização dos treinamentos convalidados ou complementados. 103. Há exigência para que o responsável técnico pelo aproveitamento e convalidação dos treinamentos/capacitações anteriores seja um engenheiro? A NR 01 não menciona quem deve convalidar os treinamentos e capacitações. Entretanto, deve-se observar o que determina a norma específica. A título de exemplo, veja-se a NR 10: 10.8.3 É considerado trabalhador capacitado aquele que atenda às seguintes condições, simultaneamente: a) receba capacitação sob orientação e responsabilidade de profissional habilitado e autorizado; e"],[75,"b) trabalhe sob a responsabilidade de profissional habilitado e autorizado. Para fins da NR 10, a capacitação está atrelada a um profissional habilitado e autorizado. Portanto, a convalidação de tal capacitação deve ser produzida também por um profissional habilitado e autorizado."],[76,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 104. A organização pode contratar um prestador de serviços para convalidar os treinamentos? Sim, a empresa pode contratar uma prestadora de serviço para fazer a convalidação, observado o disposto nos itens 1.7.7 e 1.7.8 e respectivos subitens da NR 01, devendo respeitar, ainda, o que a norma específica determina quanto àquela capacitação em particular. 105. A empresa contratante é responsável pelos treinamentos de MEI, ME e EPP contratadas cujas atividades estejam integradas em seu PGR?"],[76,"Não. A organização contratante deve fornecer às contratadas informações sobre os riscos ocupacionais sob sua gestão e que possam impactar nas atividades das contratadas. As organizações contratadas devem complementar ou definir novas medidas de prevenção, inclusive treinamento, que devem ser específicas em virtude de riscos ocupacionais existentes na contratante. 1.7.1 O empregador deve promover capacitação e treinamento dos trabalhadores, em conformidade com o disposto nas NR. 106. No caso da capacitação para máquinas e equipamentos, prevalecem as disposições da NR 01, que prevê a emissão de certificado, ou da NR 12, que aceita apenas lista de presença e não o certificado?"],[76,"Deve-se, sempre, considerar o que dispõe a norma regulamentadora específica, uma vez que a NR 01 estabelece disposições gerais. O item 12.16.5 da NR 12 admite lista de presença ou certificado como comprovante de capacitação ou treinamento: 1.1.1 O objetivo desta Norma é estabelecer as disposições gerais, o campo de aplicação, os termos e as definições comuns às Normas Regulamentadoras - NR relativas a segurança e saúde no trabalho e as diretrizes e os requisitos"],[77,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho para o gerenciamento de riscos ocupacionais e as medidas de prevenção em Segurança e Saúde no Trabalho - SST. 1.7.1 O empregador deve promover capacitação e treinamento dos trabalhadores, em conformidade com o disposto nas NR. 12.16.5 O material didático fornecido aos trabalhadores, a lista de presença dos participantes ou certificado, o currículo dos ministrantes e a avaliação dos capacitados devem ser disponibilizados à Auditoria Fiscal do Trabalho em meio físico ou digital, quando solicitado. 107. As informações em segurança e saúde no trabalho podem ser prestadas em formato digital?"],[77,"Sim. A NR 01 estabelece que os documentos em geral referentes às normas regulamentadoras podem ser emitidos e armazenados em meio digital: 1.6.2 Os documentos previstos nas NR podem ser emitidos e armazenados em meio digital com certificado digital emitido no âmbito da Infraestrutura de Chaves Públicas Brasileira (ICP-Brasil), normatizada por lei específica. A NR 01 permite, inclusive, o arquivamento em meio digital (digitalização) de documentos físicos, assinados manualmente: 1.6.3 Os documentos físicos, assinados manualmente, inclusive os anteriores à vigência desta NR, podem ser arquivados em meio digital, pelo período correspondente exigido pela legislação própria, mediante processo de digitalização conforme disposto em Lei."],[78,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 1.6.3.1 O processo de digitalização deve ser realizado de forma a manter a integridade, a autenticidade e, se necessário, a confidencialidade do documento digital, com o emprego de certificado digital emitido no âmbito da Infraestrutura de Chaves Públicas Brasileira (ICP-Brasil). 1.6.3.2 Os empregadores que optarem pela guarda de documentos prevista no caput devem manter os originais conforme previsão em lei. 108. Quais são e onde estão os modelos aprovados pela STRAB para a prestação de informações de segurança e saúde no trabalho em formato digital pelas organizações?"],[78,"O item 1.6.1 da NR 01 prevê a disponibilização de modelos aprovados pela STRAB para a prestação de informações em segurança e saúde no trabalho: 1.6.1 As organizações devem prestar informações de segurança e saúde no trabalho em formato digital, conforme modelo aprovado pela STRAB, ouvida a SIT. Esses modelos do item 1.6.1 são referenciados expressamente nos itens 1.8.4 e 1.8.6, nos quais a NR 01 estabelece as condições para dispensa de elaboração de PGR e/ou PCMSO pelas organizações:"],[78,"1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR. 1.8.6 O MEI, a ME e a EPP, graus de risco 1 e 2, que declararem as informações digitais na forma do subitem 1.6.1 e não identificarem exposições ocupacionais a agentes físicos, químicos, biológicos e riscos relacionados a fatores ergonômicos, ficam dispensados de elaboração do Programa de Controle Médico de Saúde Ocupacional - PCMSO."],[79,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Em 28 de abril de 2022 foi disponibilizado o Sistema de Recebimentos de Declarações, para fins das declarações referidas nos itens 1.8.4 e 1.8.6 da NR 01, e, portanto, especificamente para MEI, ME e EPP. Até a disponibilização do sistema, as empresas estavam obrigadas a observar o art. 3º da Portaria SEPRT/ME nº 6.730, de 2020, que estabelecia que o empregador deve elaborar e manter no estabelecimento uma declaração de inexistência de riscos no estabelecimento para fazer jus ao tratamento diferenciado:"],[79,"Art. 3° Estabelecer que, enquanto não houver sistema informatizado para o recebimento da declaração de informações digitais prevista nos subitens 1.8.4 e 1.8.6 do Anexo I desta Portaria, o empregador deverá manter declaração de inexistência de riscos no estabelecimento para fazer jus ao tratamento diferenciado. 109. Esses modelos são diferentes para micro/pequenas e médias/grandes empresas? Os modelos para prestação de informações digitais referidos no item 1.6.1 da NR 01 destinam-se apenas às empresas enquadradas nos itens 1.8.4 e 1.8.6, isto é, MEI, ME e EPP nas condições ali previstas:"],[79,"1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR. 1.8.6 O MEI, a ME e a EPP, graus de risco 1 e 2, que declararem as informações digitais na forma do subitem 1.6.1 e não identificarem exposições ocupacionais a agentes físicos, químicos, biológicos e riscos relacionados a fatores ergonômicos, ficam dispensados de elaboração do Programa de Controle Médico de Saúde Ocupacional - PCMSO."],[80,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 110. Profissionais liberais com dois funcionários têm algum enquadramento nas NR atualizadas? A NR 01 se refere aos empregadores em geral, chamando-os “organização”, termo que é definido no Anexo I - Termos e definições: “Organização: pessoa ou grupo de pessoas com suas próprias funções com responsabilidades, autoridades e relações para alcançar seus objetivos. Inclui, mas não é limitado a empregador, a tomador de serviços, a empresa, a empreendedor individual, produtor rural, companhia, corporação, firma, autoridade, parceria, organização de caridade ou instituição, ou parte ou combinação desses, seja incorporada ou não, pública ou privada.”"],[80,"Toda organização (inclusive os profissionais liberais) que possua empregados regidos pela CLT deve realizar o gerenciamento de riscos ocupacionais em seus estabelecimentos. Contudo, em situações específicas, a NR 01 isenta algumas organizações da obrigação de elaborar o PGR e/ou o PCMSO, conforme estabelecido nos itens 1.8.4 e 1.8.6: 1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR."],[80,"1.8.6 O MEI, a ME e a EPP, graus de risco 1 e 2, que declararem as informações digitais na forma do subitem 1.6.1 e não identificarem exposições ocupacionais a agentes físicos, químicos, biológicos e riscos relacionados a fatores ergonômicos, ficam dispensados de elaboração do Programa de Controle Médico de Saúde Ocupacional - PCMSO. Vale salientar, no entanto, que, conforme consta no item 1.8.5, a dispensa prevista na NR 01 é aplicável apenas quanto à elaboração do PGR e não afasta a obrigação de cumprimento das demais disposições previstas em NR:"],[81,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 1.8.5 A dispensa prevista nesta Norma é aplicável quanto à obrigação de elaboração do PGR e não afasta a obrigação de cumprimento por parte do MEI, ME e EPP das demais disposições previstas em NR. 111. Como deve ser o procedimento de uma organização contratante do MEI?"],[81,"A empresa contratante deve fornecer ao MEI as informações sobre os riscos que possam afetá-lo e incluí-lo nas suas ações de prevenção. O contratante utilizará as fichas expedidas pelo Ministério do Trabalho e Previdência, que relaciona os principais perigos e riscos comumente presentes nas atividades do MEI, de maneira a implementar as medidas de prevenção e proteção a serem adotadas para resguardar a saúde e a integridade física desse contratado. 1.8.1.1 A dispensa da obrigação de elaborar o PGR não alcança a organização contratante do MEI, que deverá incluí-lo nas suas ações de prevenção e no seu PGR, quando este atuar em suas dependências ou local previamente convencionado em contrato."],[81,"1.8.2 Serão expedidas pela Secretaria Especial de Previdência e Trabalho – SEPRT fichas com orientações sobre as medidas de prevenção a serem adotadas pelo MEI. Versão 01 – de 27/04/2022"]];DATA.t24=[["01.01.001","Arsênio e seus compostos","Químicos","ARSÊNIO E SEUS COMPOSTOS"],["01.02.001","Asbestos (ou amianto)","Químicos","ASBESTOS"],["01.03.001","Benzeno e seus compostos tóxicos (exceto os abaixo especificados, que constam expressamente no Anexo IV do Decreto 3.048/1999)","Químicos","BENZENO E SEUS COMPOSTOS TÓXICOS"],["01.03.002","Estireno (vinilbenzeno)","Químicos","BENZENO E SEUS COMPOSTOS TÓXICOS"],["01.04.001","Berílio e seus compostos function alertas(r,c){
 const a=[];
 if(!r.exp)a.push('Defina o tipo de exposição.');
 if(!r.prob||!r.sev||!r.est)a.push('Falta probabilidade, severidade ou estimativa.');
 if(/CA:\s*_+/.test(r.epi||''))a.push('Preencha o número do CA do EPI.');
 if(r.insal.status==='sim'&&!r.insal.grau)a.push('Escolha o grau da insalubridade (10%, 20% ou 40%).');
 if(r.insal.status==='sim'&&r.tipoMed==='Qualitativo'&&r.cat!=='Biológico')a.push('Insalubridade por qualitativo: confirme o critério (anexo da NR-15 que não exige limite de tolerância).');
 if((['02.01.001','02.01.014'].includes(r.esocial)||(r.cat==='Físico'&&['Ruído','Calor'].includes(r.nome)))&&r.tipoMed==='Qualitativo'&&!r.medicao)a.push('Ruído e calor pedem medição (dosimetria ou IBUTG). Registre o resultado em “Medição”.');
 if(r.ae.status==='sim'&&['Intermitente','Eventual'].includes(r.exp))a.push('Aposentadoria especial exige exposição habitual e permanente. Com exposição '+r.exp.toLowerCase()+', revise.');
 if(r.ae.status==='sim'&&['Ergonômico','Acidentes'].includes(r.tipo||r.cat))a.push('Risco '+(r.tipo||r.cat).toLowerCase()+' não consta do Anexo IV do Decreto 3.048. Só entra por decisão judicial ou administrativa.');
 if(r.peric.status==='sim'&&!r.peric.ref)a.push('Indique a base da periculosidade (NR-16, anexo).');
 if(!r.agente)a.push('Descreva o agente nocivo.');
 if(!r.danos)a.push('Preencha os possíveis danos à saúde.');
 if(!r.fonte)a.push('Descreva a fonte geradora (onde e com que frequência ocorre).');
 const n=nivel(score(r));
 if((n==='Alto'||n==='Crítico')&&!S.av.acoes.some(x=>x.riscoId===r.id||(x.risco===r.nome&&x.cargo===c.nome)))a.push('Nível '+n+' sem ação no cronograma.');
 return a;
}
function overall(c,key){
 const rs=c.riscos.filter(r=>r[key]&&r[key].status!=='na');
 if(!rs.length)return{t:'na',txt:'Não se aplica aos riscos selecionados',rs:[]};
 if(rs.some(r=>r[key].status==='sim'))return{t:'sim',txt:'Enquadra',rs:rs.filter(r=>r[key].status==='sim')};
 if(rs.some(r=>r[key].status==='avaliar'))return{t:'avaliar',txt:'A avaliar (depende de medição e laudo)',rs:rs.filter(r=>r[key].status==='avaliar')};
 return{t:'nao',txt:'Não enquadra',rs:[]};
}
function enquadramento(c){
 const i=overall(c,'insal'),p=overall(c,'peric'),a=overall(c,'ae');
 const graus=i.rs.filter(r=>r.insal.status==='sim').map(r=>+r.insal.grau||0).filter(Boolean);const g=graus.length?Math.max(...graus):0;
 const gtxt={10:'grau mínimo (10%)',20:'grau médio (20%)',40:'grau máximo (40%)'}[g]||'';
 const naoPerm=a.rs.filter(r=>['Intermitente','Eventual'].includes(r.exp));
 return{i,p,a,gtxt,naoPerm};
}

/* ---- cronograma ---- */
function marca(a,m){
 if(!a.ini)return false;const fim=a.fim||a.ini;
 if(m<a.ini||m>fim)return false;
 const st=PSTEP[a.periodicidade];
 if(st)return monthsBetween(a.ini,m)%st===0;
 if(a.periodicidade==='Contínua'||a.periodicidade==='Diária')return true;
 return m===a.ini;
}
function getMeses(x){
 if(Array.isArray(x.meses))return x.meses;
 const b0=x.ini||S.av.inicio||ymNow();
 return Array.from({length:36},(_,i)=>addMonths(b0,i)).filter(m=>marca(x,m));
}

  B.push({t:'table',widths:[30,70],rows:[K('Cargo',c.nome),K('CBO',c.cbo),K('Descrição do cargo',c.descricao)]});

function blocksToHtml(blocks){
 const cell=(c,th)=>{if(typeof c==='string')c={x:c};c=c||{};const tag=th?'th':'td';const st=c.fill&&!th?` style="background:#${c.fill};font-weight:700"`:'';
  const imgs=(c.imgs||[]).map(u=>`<img class="${c.sig?'sig':'f'}" src="${esc(u)}">`).join('');
  return`<${tag}${c.k?' class="k"':''}${c.span>1?` colspan="${c.span}"`:''}${st}>${esc(c.x).replace(/\n/g,'<br>')||'&nbsp;'}${imgs}</${tag}>`};
 return blocks.map(b=>{
  if(b.t==='title')return`<h1>${esc(b.x)}</h1>`;
  if(b.t==='sub')return`<div class="sub">${esc(b.x)}</div>`;
  if(b.t==='h1')return`<h2>${esc(b.x)}</h2>`;
  if(b.t==='h2')return`<h3>${esc(b.x)}</h3>`;
  if(b.t==='p')return`<p class="${b.small?'s':''}" style="${b.b?'font-weight:700;':''}${b.before?'margin-top:'+Math.round(b.before/20)+'px':''}">${esc(b.x)}</p>`;
  if(b.t==='li')return`<p class="s">• ${esc(b.x)}</p>`;
  if(b.t==='table'){const tot=b.widths.reduce((a,x)=>a+x,0);
   return`<table><colgroup>${b.widths.map(w=>`<col style="width:${(w/tot*100).toFixed(1)}%">`).join('')}</colgroup>${b.rows.map((r,i)=>`<tr>${r.map(c=>cell(c,b.header&&i===0)).join('')}</tr>`).join('')}</table>`}
  return'';
 }).join('');
}

async function photosToData(cargos){
 const map={};
 for(const c of cargos)for(const r of c.riscos)for(const f of(r.fotos||[])){
  if(map[f.url])continue;
  try{const res=await fetch(f.url);const b=await res.blob();map[f.url]=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(b)})}catch(e){}
 }
 return map;
}
function prepImgs(map){
 const out={};const urls=[...new Set(Object.values(map))];
 return Promise.all(urls.map(u=>new Promise(res=>{
  const im=new Image();im.onload=()=>{try{
   const c=document.createElement('canvas');const k=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   const d=c.toDataURL('image/jpeg',.82);const bin=atob(d.split(',')[1]);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
   out[u]={bytes,ext:'jpg',w:c.width,h:c.height}}catch(e){}res()};
  im.onerror=()=>res();im.src=u;
 }))).then(()=>out);
}

function parseTable(text){
 const first=text.split(/\r?\n/)[0]||'';const d=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
const rowsToObjs=rows=>{if(rows.length<2)return[];const h=rows[0].map(norm);return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]==null?'':r[i]).toString().trim());return o})};

    origem:'Importado em '+new Date().toLocaleDateString('pt-BR')});
   await Store.set('base_riscos',rec);ok++;
  }
 }else if(kind==='acao'){

   const ex=base.find(a=>norm(a.nome)===norm(nome));const tp=pick(o,['tipo']);const per=pick(o,['periodicidade','frequencia']);
   await Store.set('base_acoes',{id:ex?ex.id:'i-'+uid(),nome,tipo:TIPOS_ACAO.find(t=>norm(t)===norm(tp))||(ex&&ex.tipo)||'Medida',desc:pick(o,['descricao','detalhe'])||(ex&&ex.desc)||'',per:PERIOD.find(p=>norm(p)===norm(per))||(ex&&ex.per)||'Anual',geral:!!(ex&&ex.geral)});ok++;}
 }else{
  const base=cargosBase();
  for(const o of objs){const nome=pick(o,['cargo','funcao','nome','ocupacao']);if(!nome){skip++;continue}
   const ex=base.find(c=>norm(c.nome)===norm(nome));
   await Store.set('base_cargos',{id:ex?ex.id:'i-'+uid(),nome,cbo:pick(o,['cbo','codigo'])||(ex&&ex.cbo)||'',setor:pick(o,['setor'])||(ex&&ex.setor)||'',ambiente:pick(o,['ambiente'])||(ex&&ex.ambiente)||'',descricao:pick(o,['descricao','atividades'])||(ex&&ex.descricao)||''});ok++;}
 }
 const cols=Object.keys(objs[0]).join(', ');
 toast(ok?ok+' importado(s)'+(skip?', '+skip+' ignorado(s).':'.'):'Nada importado. Colunas lidas: '+cols);

  case'build-sanit':{const r=S.av.cargos[+d.ci].riscos[+d.ri];const f=r.formd||{};if(!f.n||!f.v||!f.m){toast('Preencha banheiros, vezes e minutos.');return}
   r.fonte=`Limpeza de ${f.n} ${+f.n===1?'banheiro':'banheiros'}, ${+f.n===1?'limpo':'limpos'} ${f.v} ${+f.v===1?'vez':'vezes'} na semana, em torno de ${f.m} minutos cada.`;S.open[r.id]=true;scheduleSave();break}
  case'sug-acoes':sugerir();scheduleSave();break;
  case'add-acao':S.av.acoes.push({id:uid(),acaoId:'',nome:'',desc:'',tipo:'Medida',periodicidade:'Única',cargo:'Todos',risco:'',riscoId:'',resp:'',ini:S.av.inicio,fim:S.av.inicio,status:'Pendente'});scheduleSave();break;
  case'del-acao':S.av.acoes.splice(+d.i,1);scheduleSave();break;
  case'mes':{const x=S.av.acoes[+d.i];if(!x)break;const s=new Set(getMeses(x));s.has(d.m)?s.delete(d.m):s.add(d.m);x.meses=[...s].sort();scheduleSave();break}
  case'lib-open':S.modal={type:'lib',sel:new Set(),tipo:''};break;
  case'lib-add':{let i=S.av.acoes.length;const n0=S.av.acoes.length;S.modal.sel.forEach(id=>{const x=baseAcao(id);if(x)S.av.acoes.push(novaAcao(x,'Todos','','',i++))});toast((S.av.acoes.length-n0)+' ação(ões) adicionada(s).');S.modal=null;scheduleSave();break}
  case'dl-docx':await dlDocx();return;
  case'dl-pdf':await dlPdf();return;
  case'dl-xlsx':dlXlsx();return;
  case'dl-copsoq':await dlCopsoq();return;
  case'print':try{window.print()}catch(e){toast('Use o menu do navegador para imprimir.')}return;
  case'base-tab':S.baseTab=d.t;break;
  case'base-new':if(!ADM()){toast('Só administradores editam a base.');break}openBaseEdit(d.kind,null);break;
  case'base-edit':if(!ADM()){toast('Só administradores editam a base.');break}openBaseEdit(d.kind,d.id);break;
  case'base-del':if(!ADM()){toast('Só administradores editam a base.');break}if(await askConfirm('Excluir este item da base?')){await Store.del({risco:'base_riscos',acao:'base_acoes',cargo:'base_cargos'}[d.kind],d.id);S.modal=null}break;
  case'modal-save':{if(!ADM()){toast('Só administradores editam a base.');S.modal=null;break}const m=S.modal;
   if(m.type==='edit-risco'){const r=m.data;r.cat=val('m-cat');r.nome=val('m-nome').trim();if(!r.nome){toast('Informe o nome do risco.');return}r.esocial=val('m-eso').trim();r.fonte=val('m-fonte');r.agente=val('m-agente');r.danos=val('m-danos');r.medidas=val('m-medidas');r.exp=val('m-exp');
    ['insal','peric','ae'].forEach(k=>{r[k]=Object.assign({},r[k],{def:val('m-'+k+'-def'),ref:val('m-'+k+'-ref')})});await Store.set('base_riscos',r)}
   else if(m.type==='edit-acao'){const x=m.data;x.nome=val('m-nome').trim();if(!x.nome){toast('Informe o nome da ação.');return}x.tipo=val('m-tipo');x.per=val('m-per');x.desc=val('m-desc');await Store.set('base_acoes',x)}
   else{const c=m.data;c.nome=val('m-nome').trim();if(!c.nome){toast('Informe o cargo.');return}c.cbo=val('m-cbo');c.setor=val('m-setor');c.descricao=val('m-desc');await Store.set('base_cargos',c)}
   S.modal=null;break}
  case'import-run':if(!ADM()){toast('Só administradores importam a base.');return}await runImport();return;
  case'import-model':saveFile('MODELO_IMPORTACAO.csv','\ufeffCategoria;Risco;eSocial;Fonte geradora;Agente nocivo;Danos à saúde;Medidas administrativas;Exposição;Insalubridade;Periculosidade;Aposentadoria especial\nQuímico;Exemplo de risco;;Onde ocorre;Agente;Danos;Medida;Intermitente;Não;Não;Não\n');return;
 }
 render();
});

/* ============ ASSINATURAS ============ */
const ASS0=()=>({tec:{img:'',nome:'',doc:'',data:''},cli:{img:'',nome:'',doc:'',cargo:'',data:''}});
const assNome=p=>{const a=(S.av.ass||{})[p]||{};return a.nome||(p==='tec'?S.av.empresa.tecnico:S.av.empresa.funcionario)||''};
const sigMap=()=>{const o={};['cli','tec'].forEach(p=>{const a=(S.av.ass||{})[p];if(a&&a.img)o['sig:'+p]=a.img});return o};
function assCard(){
 const A=S.av.ass;
 const one=(p,titulo)=>`<div class="sigbox"><b>${titulo}</b>
  <div class="grid2"><div>${fld('Nome',inp('ass.'+p+'.nome',assNome(p)))}</div><div>${fld(p==='cli'?'CPF / documento':'Registro profissional / CPF',inp('ass.'+p+'.doc',A[p].doc))}</div>
  ${p==='cli'?`<div>${fld('Função / cargo',inp('ass.cli.cargo',A.cli.cargo))}</div>`:''}<div>${fld('Data',inp('ass.'+p+'.data',A[p].data,'date'))}</div></div>
  <label class="f">Assinatura (desenhe com o dedo ou o mouse)</label>
  <canvas class="pad" data-pad="${p}" width="600" height="200"></canvas>
  <div class="row" style="margin-top:6px"><button class="btn small ghost" data-act="pad-clear" data-p="${p}">Limpar assinatura</button></div></div>`;
 return`<div class="card noprint"><h3>Assinaturas</h3><div class="hint">O cliente assina na tela do celular ou do computador; a assinatura entra no fim do relatório completo (Word, PDF e impressão). Se preferir assinar no papel, deixe em branco: as linhas ficam no relatório.</div>
 ${one('cli','Cliente (responsável da empresa)')}${one('tec','Técnico(a) responsável')}</div>`}
function padSave(p,cv){const a=S.av.ass[p];a.img=cv.toDataURL('image/png');if(!a.data)a.data=new Date().toISOString().slice(0,10);const di=document.querySelector('[data-bind="ass.'+p+'.data"]');if(di&&!di.value)di.value=a.data;scheduleSave();refreshReportView()}
function setupPads(){
 document.querySelectorAll('canvas[data-pad]').forEach(cv=>{
  const p=cv.dataset.pad,ctx=cv.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  const cur=S.av&&S.av.ass&&S.av.ass[p];
  if(cur&&cur.img){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=cur.img}
  ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  let down=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}down=true;last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke()});
  cv.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();const q=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q});
  const end=()=>{if(!down)return;down=false;padSave(p,cv)};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 })}
let rrT=null;
function refreshReportView(){clearTimeout(rrT);rrT=setTimeout(()=>{const el=document.getElementById('reportView');if(el&&S.view==='av'&&S.tab==='rel')el.innerHTML=blocksToHtml(reportBlocks(curList()))},350)}
function sigBlocks(B){
 const e=S.av.empresa,A=S.av.ass||ASS0();const dt=A.tec.data||A.cli.data;
 B.push({t:'h1',x:'Assinaturas'});
 B.push({t:'p',x:'Local e data: '+(e.cidade?e.cidade+', ':'')+(dt?fmtD(dt):'____/____/______'),b:1});
 const sig=p=>({x:A[p].img?'':'\n\n\n',imgs:A[p].img?[A[p].img]:[],sig:1});
 const info=p=>({x:'Nome: '+(assNome(p)||'______________________________')+'\n'+(p==='cli'?'CPF / documento: ':'Registro profissional / CPF: ')+(A[p].doc||'________________')+(p==='cli'?'\nFunção: '+(A.cli.cargo||'________________'):'')});
 B.push({t:'table',widths:[50,50],rows:[[{x:'Cliente (responsável da empresa)',k:1},{x:'Técnico(a) responsável',k:1}],[sig('cli'),sig('tec')],[info('cli'),info('tec')]]});
}
