Conservação Auditiva"],[9,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho"],[9,"PCMAT - Programa de Condições e Meio Ambiente de Trabalho PCMSO - Programa de Controle Médico de Saúde Ocupacional PGR - Programa de Gerenciamento de Riscos PGRTA - Programa de Gerenciamento de Riscos no Trabalho Aquaviário PGRTR - Programa de Gerenciamento de Riscos no Trabalho Rural PH - Profissional Habilitado PPP - Perfil Profissiográfico Previdenciário PPR - Programa de Proteção Respiratória PPRA - Programa de Prevenção de Riscos Ambientais PRE - Plano de Resposta a Emergências SEPRT - Secretaria Especial de Previdência e Trabalho SIPAT - Semana Interna de Prevenção de Acidentes do Trabalho SIT - Subsecretaria de Inspeção do Trabalho SRT - Superintendência Regional do Trabalho SST - Segurança e Saúde no Trabalho STRAB - Secretaria de Trabalho"],[10,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho"],[10,"Em 9 de março de 2020, foi publicada a Portaria SEPRT/ME nº 6.730, que incluiu o gerenciamento de risco ocupacional no capítulo 1.5 e promoveu outras alterações na redação da NR 01. A Portaria SEPRT/ME nº 8.873, de 23 de julho de 2021, prorrogou o prazo do início da vigência da nova NR 01 para o dia 3 de janeiro de 2022. O novo texto da NR 01, contemplando o Gerenciamento de Riscos Ocupacionais (GRO), materializado no Programa de Gerenciamento de Riscos (PGR), consolidado por consenso entre as bancadas da Comissão Tripartite Paritária Permanente (CTPP), não só atende a um anseio que permeou os vinte e cinco anos de discussão tripartite na elaboração de normas regulamentadoras, como possibilita um inegável avanço na segurança e saúde no trabalho, ao contemplar o gerenciamento de todos os riscos ocupacionais. Para a consulta à base legal que serviu para construção deste documento e ao texto integral da NR 01, acesse: https://www.gov.br/trabalho-e-previdencia/pt-br/composicao/orgaos-especificos/secretaria-de- trabalho/inspecao/seguranca-e-saude-no-trabalho/ctpp-nrs/nr-1"],[10,"Nesse contexto, a inspeção do trabalho tem realizado diversos eventos como parte do plano de implementação da NR1, ocasião em que se verificou e coletou as principais dúvidas quanto ao correto gerenciamento dos riscos ocupacionais. Assim, este documento tem como objetivo apresentar respostas às dúvidas selecionadas a partir das transmissões e aulas disponibilizadas gratuitamente no canal da Escola Nacional da Inspeção do Trabalho (ENIT) no YouTube por meio do link: https://www.gov.br/trabalho-e-previdencia/pt-br/composicao/orgaos-especificos/secretaria-de- trabalho/inspecao/seguranca-e-saude-no-trabalho/pgr"],[11,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Gerenciamento de Riscos Ocupacionais (GRO) 1. O que é o Gerenciamento de Riscos Ocupacionais?"],[11,"O Gerenciamento de Riscos Ocupacionais (GRO) é a sistematização dos processos de identificação de perigos, avaliação dos riscos ocupacionais e controle dos riscos ocupacionais, este articulado com ações de saúde, de análise de acidentes e de preparação para emergências, dentre outros requisitos legais. Destaca-se que o gerenciamento de riscos ocupacionais deve ser implementado em cada um dos estabelecimentos da organização e deve alcançar todos os perigos e riscos ocupacionais existentes. A NR 01, capítulo 1.5 – Gerenciamento de riscos ocupacionais, estabelece as diretrizes e requisitos para o gerenciamento de riscos ocupacionais e as medidas de prevenção em Segurança e Saúde no Trabalho (SST). Os processos obrigatórios do gerenciamento de riscos ocupacionais são materializados no documento denominado de Programa de Gerenciamento de Riscos (PGR), que é composto pelo inventário de riscos ocupacionais e pelo plano de ação. Além desses documentos, outras informações devem ser formalmente registradas para o atendimento às normas de SST, sendo imprescindível, por exemplo, a elaboração e o arquivamento do relatório de análise de acidentes e doenças do trabalho. Frise-se que organizações desobrigadas de elaborar um PGR ainda assim possuem o dever de gerenciar os riscos ocupacionais existentes."],[11,"2. Qual a diferença entre perigo e risco ocupacional? O perigo é uma fonte com o potencial de causar lesões ou agravos à saúde, sendo caracterizada a partir do momento que existe a exposição."],[12,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Essa exposição pode ser ocasionada por um evento perigoso, uma exposição a agente nocivo ou uma exigência da atividade de trabalho, que, isoladamente ou em combinação com outras fontes, tem o potencial de dar origem a lesões ou agravos à saúde. O risco ocupacional é variável e possui um nível, determinado pela combinação da probabilidade e da severidade de possíveis lesões ou agravos à saúde. São levados em conta para a avaliação do risco diversos fatores que constituem a probabilidade e a severidade. Esses conceitos estão no Anexo I - Termos e definições da NR 01:"],[12,"“Perigo ou fator de risco ocupacional / Perigo ou fonte de risco ocupacional: Fonte com o potencial de causar lesões ou agravos à saúde. Elemento que isoladamente ou em combinação com outros tem o potencial intrínseco de dar origem a lesões ou agravos à saúde.” “Risco ocupacional: Combinação da probabilidade de ocorrer lesão ou agravo à saúde causados por um evento perigoso, exposição a agente nocivo ou exigência da atividade de trabalho e da severidade dessa lesão ou agravo à saúde.” 3. Como será promovida a higiene ocupacional no âmbito do GRO? A nova redação da NR 09, publicada pela Portaria SEPRT/ME nº 6.735, de 10 de março de 2020, vigente desde 3 de janeiro de 2022, estabelece requisitos para avaliação dos riscos físicos, químicos e biológicos, nos termos do item 9.1.1:"],[12,"9.1.1 Esta Norma Regulamentadora - NR estabelece os requisitos para a avaliação das exposições ocupacionais a agentes físicos, químicos e biológicos quando identificados no Programa de Gerenciamento de Riscos - PGR, previsto na NR-1, e subsidiá-lo quanto às medidas de prevenção para os riscos ocupacionais. O inventário dos riscos de que cuida a higiene ocupacional, além de outros, será consolidado no PGR, que também conterá medidas de prevenção. Importante destacar que a NR 09 impõe a obrigatoriedade de realização de análise preliminar das atividades de trabalho e dos dados já disponíveis a fim de"],[13,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho determinar a necessidade de adoção direta de medidas de prevenção ou de realização de avaliações qualitativas ou, quando aplicáveis, de avaliações quantitativas, incorporando-se os resultados das avaliações das exposições ocupacionais aos agentes físicos, químicos e biológicos ao inventário de riscos do PGR. 4. Posso realizar o GRO unificado para trabalhadores de empresas diferentes que atuam nos mesmos ambientes e estão expostos aos mesmos riscos?"],[13,"Depende. Nos centros comerciais, shoppings, feiras, convenções, dentre outros, cada empresa deve fazer o gerenciamento do seu risco ocupacional. Adicionalmente, essas empresas devem executar ações integradas, que possibilitem a proteção de todos os trabalhadores expostos. Um importante exemplo é um procedimento de resposta a emergências de incêndio para todas as organizações do mesmo local de trabalho, aplicando medidas de prevenção comuns e visando o mesmo tratamento aos riscos ocupacionais. 1.5.8.1 Sempre que várias organizações realizem, simultaneamente, atividades no mesmo local de trabalho devem executar ações integradas para aplicar as medidas de prevenção, visando à proteção de todos os trabalhadores expostos aos riscos ocupacionais."],[13,"Caso sejam empresas terceirizadas realizando atividades no ambiente da contratante, o item 1.5.8.2 informa que o PGR da empresa contratante pode incluir as medidas de prevenção para as empresas contratadas para prestação de serviços que atuem em suas dependências ou local previamente convencionado em contrato ou o PGR pode referenciar os programas das contratadas. A indicação de quem está exposto ao perigo/risco pode ser individualizada ou por grupo de trabalhadores que compartilham o mesmo padrão de exposição devido à similaridade dos determinantes envolvidos, como o ambiente, o trabalho no mesmo setor, os processos e materiais que utilizam e as tarefas realizadas."],[14,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Programa de Gerenciamento de Riscos (PGR) 5. O que é o Programa de Gerenciamento de Riscos (PGR)? É o documento que materializa o gerenciamento dos riscos ocupacionais pela organização. O PGR pode ser implementado por estabelecimento, unidade operacional, setor ou atividade. Deve ser composto pelo inventário de riscos ocupacionais e pelo plano de ação. Além desses documentos, outras informações devem ser formalmente registradas para o atendimento ao arcabouço normativo de SST. 6. As instituições públicas com servidores estatutários devem elaborar e implementar PGR?"],[14,"Não. Conforme redação do item 1.2.1.1 da NR 01, as normas regulamentadoras se aplicam a empregados regidos pela Consolidação das Leis do Trabalho (CLT): 1.2.1.1 As NR são de observância obrigatória pelas organizações e pelos órgãos públicos da administração direta e indireta, bem como pelos órgãos dos Poderes Legislativo, Judiciário e Ministério Público, que possuam empregados regidos pela Consolidação das Leis do Trabalho – Apesar disso, o item 1.2.1.2 da NR 01 registra a aplicabilidade das disposições das normas regulamentadoras a outras relações jurídicas quando houver previsão para tanto nas legislações específicas: 1.2.1.2 Nos termos previstos em lei, aplica-se o disposto nas NR a outras relações jurídicas."],[15,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 7. O MEI está dispensado de elaborar o PGR? Como regra, o MEI está sempre dispensado de elaborar o PGR. É o que diz expressamente a NR 1 1.8.1 O Microempreendedor Individual - MEI está dispensado de elaborar o PGR 8. Quais ME e EPP receberam tratamento diferenciado e foram dispensadas de elaborar o PGR? Apenas as ME e as EPP, graus de risco 1 e 2, desobrigadas de constituir SESMT, que no levantamento preliminar de perigos não tenham identificado exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR 09, foram dispensadas de elaborar o PGR."],[15,"1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR. Assim, seguem obrigadas a elaborar e implementar o PGR as ME e as EPP de graus de risco 1 e 2 com exposições a agentes físicos, químicos e biológicos, bem como as ME e as EPP de graus de risco 3 e 4, independentemente da natureza da exposição. As dispensadas devem cumprir as formalidades exigidas pela NR-1 para usufruir desse benefício. Saiba mais sobre o assunto no capítulo Dispensa de PGR e PCMSO deste documento."],[15,"9. As empresas que não têm riscos ocupacionais precisam fazer o PGR? A dispensa prevista na NR 01 quanto à obrigação de elaboração do PGR é aplicável somente para ME e EPP, desde que seu CNAE seja de grau de risco 1 ou"],[16,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho"],[16,"2 de acordo com a Norma Regulamentadora nº 04 (NR 04), conforme os itens 1.8.1 e 1.8.4 da NR 01. Assim, caso não atenda a essas exigências (grau de risco 1 ou 2 e ser ME ou EPP), mesmo que a empresa não identifique riscos, deve elaborar o PGR. Destaca-se que o MEI sempre estará dispensado de elaborar o PGR, tendo à sua disposição as fichas MEI. Observa-se que os riscos ocupacionais que devem estar contemplados no PGR são muito mais amplos do que aqueles previstos no antigo Programa de Prevenção de Riscos Ambientais (PPRA), que se restringia aos riscos ambientais (agentes físicos, químicos e biológicos). No PGR, além dos agentes físicos, químicos e biológicos, devem constar todos os demais perigos presentes no ambiente de trabalho, entre os quais citamos os perigos ergonômicos, mecânicos ou de acidentes. O PGR deve fazer interfaces com outras NR e contemplar ou estar integrado com planos, programas e outros documentos previstos na legislação de SST. Dessa forma, nota-se, no item 7.4 da NR 07, que o planejamento de exames médicos clínicos e complementares a serem realizados deve estar em conformidade com os riscos ocupacionais identificados e classificados no PGR. Observa-se, ainda, que o item 7.5.8 da NR 07 informa que, para as empresas que não possuem riscos ocupacionais identificados e classificados no PGR, o exame clínico deve ser realizado a cada dois anos."],[16,"10.Quem pode elaborar e assinar o PGR? Os documentos integrantes do PGR devem ser elaborados sob a responsabilidade da organização, respeitado o disposto nas demais normas regulamentadoras, datados e assinados. A organização pode designar e atribuir funções e responsabilidades específicas para uma pessoa ou equipes de trabalho, mas, quando se tratar de uma documentação relativa a um requisito legal, deve ser respeitado o disposto nas demais normas regulamentadoras, que determinam especificamente a responsabilidade pela elaboração de documentos. Isso significa que qualquer profissional indicado pela organização pode assinar o PGR, independentemente de sua formação profissional. A exceção é a"],[17,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho construção civil, em função do disposto nos itens 18.4.2 e 18.4.2.1 da Norma Regulamentadora nº 18 (NR 18): 18.4.2 O PGR deve ser elaborado por profissional legalmente habilitado em segurança do trabalho e implementado sob responsabilidade da organização. 18.4.2.1 Em canteiros de obras com até 7 m (sete metros) de altura e com, no máximo, 10 (dez) trabalhadores, o PGR pode ser elaborado por profissional qualificado em segurança do trabalho e implementado sob responsabilidade da organização."],[17,"Cabe salientar, porém, que algumas normas regulamentadoras exigem profissionais específicos para proceder determinadas análises de risco, especificações técnicas ou procedimentos, devendo nesses casos serem mantidos os respectivos registros, a serem anexados ou referenciados pelo PGR, conforme o caso. São exemplos: • Norma Regulamentadora nº 10 (NR 10) - Os documentos técnicos previstos no Prontuário de Instalações Elétricas devem ser elaborados por profissional legalmente habilitado. O projeto elétrico deve ser assinado por profissional legalmente habilitado; • Norma Regulamentadora nº 12 (NR 12) - Os sistemas de segurança de máquinas e equipamentos devem ser selecionados e instalados de modo a estar sob a responsabilidade técnica de profissional legalmente habilitado. A instalação de sistemas de segurança deve ser realizada por profissional legalmente habilitado ou profissional qualificado ou capacitado, quando autorizados pela empresa; e • Norma Regulamentadora nº 13 (NR 13) - Os projetos de alterações ou reparo devem ser concebidos ou aprovados por Profissional Habilitado - (PH). Tanto o inventário de riscos quanto o plano de ação do PGR podem ser datados e assinados de forma eletrônica, em conformidade ao disposto no item 1.6.2 da própria NR 01, desde que o sistema permita a rastreabilidade e verificação por auditorias futuras. Tal medida possibilita, por exemplo, o uso do certificado digital (eCNPJ) da própria organização."],[18,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Optando-se por uma pessoa natural, indicada pela organização como responsável ou representante legal, esta datará e assinará os referidos documentos, o que também pode ser feito com uso do certificado digital, nos termos do item 1.6.2 da NR 01. O governo federal disponibiliza gratuitamente uma plataforma para assinatura de arquivos digitais, em substituição ao certificado digital. Mais informações podem ser obtidas em https://www.gov.br/governodigital/pt-br/assinatura-eletronica. 11. Posso contratar uma empresa de consultoria para elaborar o PGR?"],[18,"Sim. A organização pode designar e atribuir funções e responsabilidades específicas para uma pessoa ou equipes de trabalho, observado o disposto nas demais normas regulamentadoras quando determinem especificamente a responsabilidade técnica para a elaboração de certos documentos, como o prontuário das instalações elétricas. Perante o Estado, na esfera administrativa, a responsabilidade é sempre da organização, mesmo que contrate terceiros. 12.1.5.7.2 Os documentos integrantes do PGR devem ser elaborados sob a responsabilidade da organização, respeitado o disposto nas demais Normas Regulamentadoras, datados e assinados. Para elaboração do PGR deve ser emitida Anotação de Responsabilidade Técnica (ART)?"],[18,"Não. A responsabilidade de elaboração do PGR é da organização, que deve demonstrar liderança e comprometimento com a gestão dos riscos ocupacionais. A Anotação de Responsabilidade Técnica (ART) foi instituída pela Lei nº 6.496, de 7 de dezembro de 1977, e sua emissão é obrigatória em todo contrato para execução de obra ou prestação de serviço de engenharia, agronomia, geologia, geografia e meteorologia, bem como para o desempenho de cargo ou função para a qual sejam necessários habilitação legal e conhecimentos técnicos nas profissões abrangidas pelo sistema CONFEA/CREA. Portanto, eventualmente, alguns documentos que compõem o PGR devem ser acompanhados da respectiva ART."],[18,"1.5.7.2 Os documentos integrantes do PGR devem ser elaborados sob a responsabilidade da organização, respeitado o disposto nas demais Normas Regulamentadoras, datados e assinados."],[19,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 1.6.1 As organizações devem prestar informações de segurança e saúde no trabalho em formato digital, conforme modelo aprovado pela STRAB, ouvida a SIT. 1.6.1.1 Os modelos aprovados pela STRAB devem considerar os princípios de simplificação e desburocratização. 13. Há quantidade mínima de empregados para elaboração do PGR? Não. O gerenciamento de riscos ocupacionais deve ser implementado por estabelecimento, desde que existam empregados, independentemente da quantidade. 1.5.3.1 A organização deve implementar, por estabelecimento, o gerenciamento de riscos ocupacionais em suas atividades."],[19,"Todas as organizações que não estejam contempladas pela dispensa prevista no capítulo 1.8 Tratamento diferenciado ao Microempreendedor Individual – MEI, à Microempresa – ME e à Empresa de Pequeno Porte – EPP da NR 01 devem elaborar o PGR. Essa dispensa é tratada em detalhes na seção Dispensa PGR e PCMSO deste documento. 14. O PGR tem validade? É preciso fazer a atualização a cada 1 ano?"],[19,"O PGR é um programa e não um projeto; tem começo, mas não tem fim. Esse programa deve representar/refletir a realidade presente da organização, contemplando todos os processos existentes na organização. A nova NR 01 estabelece que o PGR deve ser um processo contínuo, a ser revisto a cada 2 (dois) anos (em organizações que não tiverem alterações no inventário de risco durante esse período), ou quando da ocorrência das situações previstas no item 1.5.4.4.6. Assim, considerada a dinamicidade das organizações, tem-se que a revisão bianual é exceção, devendo ser implementada apenas se não ocorrerem as situações abaixo transcritas:"],[20,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 1.5.4.4.6 A avaliação de riscos deve constituir um processo contínuo e ser revista a cada dois anos ou quando da ocorrência das seguintes situações: a) após implementação das medidas de prevenção, para avaliação de riscos residuais; b) após inovações e modificações nas tecnologias, ambientes, processos, condições, procedimentos e organização do trabalho que impliquem em novos riscos ou modifiquem os riscos existentes; c) quando identificadas inadequações, insuficiências ou ineficácias das medidas de prevenção; d) na ocorrência de acidentes ou doenças relacionadas ao trabalho; e) quando houver mudança nos requisitos legais aplicáveis."],[20,"15. É verdade que algumas empresas possuem um prazo maior, de 3 anos, para revisitar a avaliação de riscos?? Sim, mas apenas organizações que possuem sistema de gestão certificados por Organismos de Avaliação da Conformidade (OAC) podem rever seus planos em até 3 anos. 1.5.4.4.6.1 No caso de organizações que possuírem certificações em sistema de gestão de SST, o prazo poderá ser de até 3 (três) anos. Em geral, a avaliação de riscos deve constituir um processo contínuo e ser revista a cada dois anos ou quando da ocorrência das situações constantes nas alíneas do item 1.5.4.4.6 (veja a questão anterior) 16. Posso ter mais de um PGR por estabelecimento?"],[21,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Sim. A organização deve implementar o gerenciamento de riscos ocupacionais por estabelecimento e, a seu critério, o PGR pode ser implementado por unidade operacional, setor ou atividade. Portanto, em um mesmo estabelecimento, pode haver diversos PGR. A organização deve decidir, a partir do conhecimento e estudo dos processos de trabalho, se o desmembramento do PGR poderá trazer maior simplificação e otimizar os processos de gerenciamento de riscos ocupacionais. 1.5.3.1.1.1 A critério da organização, o PGR pode ser implementado por unidade operacional, setor ou atividade."],[21,"17. É obrigatório o envio do PGR para a Superintendência Regional do Trabalho (SRT) e para o sindicato da categoria? Não. A NR 01 não determina o envio prévio do PGR para a Superintendência Regional do Trabalho (SRT), nem para o sindicato. Entretanto, o item 1.5.7.2.1 da NR 01 estabelece que esses documentos estejam sempre disponíveis para a inspeção do trabalho, assim como aos trabalhadores interessados ou seus representantes: 1.5.7.2.1 Os documentos integrantes do PGR devem estar sempre disponíveis aos trabalhadores interessados ou seus representantes e à Inspeção do Trabalho. Assim, a empresa sob ação fiscal deve apresentar os documentos notificados pelo auditor-fiscal do trabalho 18. O PGR da NR 01 deve ser aplicado de maneira geral, em todas as normas regulamentadoras?"],[21,"A NR 01, norma geral segundo o art. 117 da Portaria MTP nº 672, de 8 de novembro de 2021, deve ser aplicada e harmonizada com todas as demais normas regulamentadoras, exceto a Norma Regulamentadora nº 31 (NR 31), que, por ser regida pela Lei nº 5.889, de 8 de junho de 1973, e não pela CLT, possui"],[22,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho"],[22,"lógica própria para a sua elaboração. O trabalho aquaviário, dadas suas peculiaridades, também é gerenciado de forma especial, em observância ao disposto nos itens 30.4.1 e 30.4.1.1 da Norma Regulamentadora nº (NR 30). O PGR deve fazer interfaces com outras NR e contemplar ou estar integrado com planos, programas e outros documentos previstos na legislação de SST. Destaca-se que outras NR também gerais, como a Norma Regulamentadora nº 7 – Programa de Controle Médico de Saúde Ocupacional (NR-7), a Norma Regulamentadora nº 9 – Avaliação e Controle das Exposições Ocupacionais a Agentes Físicos, Químicos e Biológicos (NR-9) e a Norma Regulamentadora nº 17 – Ergonomia (NR-17), já foram atualizadas e contemplam a integração com o PGR."],[22,"19.O condomínio do shopping é responsável pela elaboração e coordenação do PGR? Nos centros comerciais, shoppings, feiras, convenções, dentre outros, cada empresa deve fazer o gerenciamento do seu risco ocupacional. Adicionalmente, essas empresas devem executar ações integradas, que possibilitem a proteção de todos os trabalhadores expostos. Um importante exemplo é um procedimento de resposta a emergências de incêndio para todas as organizações do mesmo local de trabalho, aplicando medidas de prevenção comuns e visando o mesmo tratamento aos riscos ocupacionais."],[22,"1.5.8.1 Sempre que várias organizações realizem, simultaneamente, atividades no mesmo local de trabalho devem executar ações integradas para aplicar as medidas de prevenção, visando à proteção de todos os trabalhadores expostos aos riscos ocupacionais. 20. Como fica o PGR na NR 18? Quem assina? O PGR na indústria da construção deve contemplar, além das exigências previstas na NR 01, as especificidades contidas na NR 18."],[23,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Em canteiros de obras com até 7 m (sete metros) de altura e com, no máximo, 10 (dez) trabalhadores, o PGR pode ser elaborado por profissional qualificado em segurança do trabalho e implementado sob responsabilidade da organização. Nos demais casos, deve ser elaborado por profissional legalmente habilitado em segurança do trabalho. 18.4.2 O PGR deve ser elaborado por profissional legalmente habilitado em segurança do trabalho e implementado sob responsabilidade da organização."],[23,"18.4.2.1 Em canteiros de obras com até 7 m (sete metros) de altura e com, no máximo, 10 (dez) trabalhadores, o PGR pode ser elaborado por profissional qualificado em segurança do trabalho e implementado sob responsabilidade da organização. 18.4.3 O PGR, além de contemplar as exigências previstas na NR-01, deve conter os seguintes documentos: 21. O Programa de Condições e Meio Ambiente de Trabalho (PCMAT) deve ser englobado no PGR ou mantém-se como documento separado? O que fazer com os PCMAT anteriores à vigência da Norma?"],[23,"Com a nova redação da NR 18, publicada pela Portaria SEPRT/ME nº 3.733, de 10 de fevereiro de 2020, não há mais previsão normativa para o programa chamado Programa de Condições e Meio Ambiente de Trabalho (PCMAT). Entretanto, os PCMAT constituídos antes de 3 de janeiro de 2022 terão validade até o final da obra a que se referem, nos termos do item 18.17.1: 18.17.1 O Programa de Condições e Meio Ambiente de Trabalho da indústria da construção (PCMAT) existente antes da entrada em vigência desta Norma terá validade até o término da obra a que se refere. Para obras iniciadas a partir de 03/01/2022, não há mais que se falar em PCMAT. Para obras em atividade antes de 03/01/22, mas que não possuíam PCMAT, deve ser desenvolvido o PGR."],[24,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 22. No caso de obras de curta duração, é necessário elaborar o PGR? O objetivo do PGR é gerenciar os riscos ocupacionais das atividades desenvolvidas na obra. Os riscos da atividade independem do tempo para sua conclusão. A NR 18 não estabelece critério mínimo de quantidade de funcionários ou mesmo da duração da obra para a elaboração e implementação do PGR. 18.4.1 São obrigatórias a elaboração e a implementação do PGR nos canteiros de obras, contemplando os riscos ocupacionais e suas respectivas medidas de prevenção. A isenção com relação à elaboração de PGR encontra-se previstas no item 1.8.4 da NR 01:"],[24,"1.8.4 As microempresas e empresas de pequeno porte, graus de risco 1 e 2, que no levantamento preliminar de perigos não identificarem exposições ocupacionais a agentes físicos, químicos e biológicos, em conformidade com a NR9, e declararem as informações digitais na forma do subitem 1.6.1, ficam dispensadas da elaboração do PGR. 23. Uma construtora deve fazer um PGR para cada obra? De acordo com a NR 18, a construtora deve fazer o gerenciamento de riscos ocupacionais em cada canteiro de obras. Porém, em uma obra pode haver vários PGR, uma vez que, segundo a NR 01, este programa pode ser implementado por unidade operacional, setor ou atividade."],[24,"18.4.1 São obrigatórias a elaboração e a implementação do PGR nos canteiros de obras, contemplando os riscos ocupacionais e suas respectivas medidas de prevenção."],[25,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 1.5.3.1.1.1 A critério da organização, o PGR pode ser implementado por unidade operacional, setor ou atividade. 24.Como fica o PGR na NR 22? O PGR para o setor da mineração deve observar a NR 01 e contemplar as especificidades contidas na NR 22: 22.3.7 Cabe à empresa ou Permissionário de Lavra Garimpeira elaborar e implementar o Programa de Gerenciamento de Riscos - PGR, contemplando os aspectos desta Norma, incluindo, no mínimo, os relacionados a: 25. Como fica o PGR na NR 30?"],[25,"No trabalho aquaviário, deve-se observar, além das exigências previstas na NR 01, o Programa de Gerenciamento de Riscos no Trabalho Aquaviário (PGRTA) para cada embarcação, conforme o disposto pela NR 30: 30.4.1 O empregador ou equiparado deve elaborar e implementar o PGRTA, por embarcação, nos termos da Norma Regulamentadora nº 01 (NR-01) e do disposto nesta NR, com base nas necessidades e peculiaridades das atividades aquaviárias. 26.Como fica o PGR na NR 31?"],[25,"Conforme o disposto no capítulo 31.3 da Norma Regulamentadora nº 31 – Segurança e Saúde no Trabalho na agricultura, pecuária, silvicultura, exploração florestal e aquicultura, a depender das formas de relações de trabalho e emprego e do local das atividades em estabelecimentos rurais, exige-se um Programa de Gerenciamento de Riscos no Trabalho Rural (PGRTR) específico. O PGRTR da NR 31 independe da NR 01, ou seja, tem requisitos próprios a serem atendidos. Similares, mas não idênticos ao previstos na NR 01:"],[26,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 31.3.1 O empregador rural ou equiparado deve elaborar, implementar e custear o PGRTR, por estabelecimento rural, por meio de ações de segurança e saúde que visem à prevenção de acidentes e doenças decorrentes do trabalho nas atividades rurais. 27. O empregador rural que mantém os contratos dos trabalhadores no seu CPF deve elaborar um PGR ou o PGRTR? Nesse caso, trata-se de empregador rural equiparado, que, portanto, deve elaborar, implementar e custear o PGRTR, conforme consta no item 31.3.1 da NR 31:"],[26,"31.3.1 O empregador rural ou equiparado deve elaborar, implementar e custear o PGRTR, por estabelecimento rural, por meio de ações de segurança e saúde que visem à prevenção de acidentes e doenças decorrentes do trabalho nas atividades rurais. 28. A organização pode optar por apresentar o PGR da NR 01 contendo toda a avaliação de riscos e as medidas previstas nas demais NR ou por apresentar os PGR específicos de cada NR?"],[26,"Não há um PGR específico para cada NR. As diretrizes gerais para o PGR são previstas na NR 01, podendo as demais normas, em função de suas especificidades, estabelecer disposições complementares a esse mesmo programa. Todas as normas regulamentadoras serão harmonizadas à NR 01. A NR 31 é uma exceção, pois, por ser regida pela Lei nº 5.889, de 1973, e não pela CLT, possui uma lógica própria para a sua elaboração, como explicado na resposta à questão 21. Assim, o PGR pode contemplar todos os documentos previstos nas outras NR em \"um só documento\" ou pode fazer remissão/estar integrado com planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho."],[27,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 29. Há necessidade de separar o PGR da NR 01 e da NR 12? Ou há apenas um PGR? Não há um PGR específico da NR 12. A NR 01 trata das diretrizes e requisitos para o gerenciamento de riscos ocupacionais e as medidas de prevenção em SST, conforme o capítulo 1.5 – Gerenciamento de riscos ocupacionais. Os processos obrigatórios do gerenciamento de risco ocupacional são materializados no documento denominado PGR. O PGR pode contemplar todos os documentos previstos nas outras NR ou pode fazer remissão/estar integrado com planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho."],[27,"1.5.3.1.3 O PGR deve contemplar ou estar integrado com planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho. Todas as normas regulamentadoras serão harmonizadas à NR 01. A NR 31 é uma exceção, pois, por ser regida pela Lei nº 5.889, de 1973, e não pela CLT, possui lógica própria para a sua elaboração, como explicado na resposta à questão 21. 30.Quais outros registros e evidências devem ser gerados pelo gerenciamento de risco ocupacional, além do PGR?"],[27,"• Documento com os procedimentos de respostas aos cenários de emergências; • Documentos com as análises de acidentes e doenças relacionadas ao trabalho ocorridos na empresa a partir de 3 de janeiro de 2022; • Planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho que são contemplados, integrados ou citados no PGR da empresa;"],[28,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho • Evidências de que a organização realizou a consulta dos trabalhadores quanto à percepção de riscos ocupacionais e a comunicação aos trabalhadores sobre os riscos consolidados no inventário de riscos; • Evidências documentais de acompanhamento das medidas de prevenção contendo, no mínimo: 1. Verificação da execução das ações planejadas; 2. Inspeções dos locais e equipamentos de trabalhos; e 3. Monitoramento das condições ambientais e exposições a agentes nocivos, quando aplicável. 31. Como integrar o PGR com planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho?"],[28,"O PGR deve manter a integração com planos, programas e outros documentos previstos nas demais normas regulamentadoras. Como exemplo, citam-se o Programa de Conservação Auditiva (PCA), o prontuário de instalações elétricas da NR 10, o Plano de Prevenção de Riscos de Acidentes com Materiais Perfurocortantes da Norma Regulamentadora nº 32 (NR 32) e os relatórios de inspeção de segurança da NR 13. Todos esses documentos e programas fornecem evidências e informações que irão alimentar o PGR. 32. O PGR pode anexar outros programas ou documentos? Caso eu tenha uma gestão de trabalho em altura, com procedimentos padronizados, posso somente citar esse procedimento no PGR?"],[28,"Sim. O PGR pode contemplar todos os documentos previstos nas outras NR ou pode fazer remissão/estar integrado com planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho. Entretanto, sempre que houver um perigo, este deve ser tratado com a metodologia prevista na NR 01, observadas as etapas do inventário de riscos ocupacionais e os requisitos do plano de ação."],[29,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 33. O PGR deve ser baseado no Laudo Técnico das Condições Ambientais do Trabalho (LTCAT)? O PGR substitui o LTCAT ou o Perfil Profissiográfico Previdenciário (PPP)?"],[29,"Não. O Laudo Técnico das Condições Ambientais de Trabalho (LTCAT) tem finalidade previdenciária, enquanto o PGR deve ser utilizado para fins de prevenção e gerenciamento dos riscos ocupacionais. O LTCAT é um comprovante, exigido pelo Instituto Nacional do Seguro Social (INSS), de que o trabalhador esteve exposto a determinados agentes nocivos durante o período de permanência na empresa, com a finalidade de determinar se o trabalhador terá direito a aposentadoria especial. O Perfil Profissiográfico Previdenciário (PPP) é um formulário estabelecido pelo INSS com campos a serem preenchidos com todas as informações relativas ao empregado, como por exemplo, a atividade que exerce, o agente nocivo ao qual está exposto, a intensidade e a concentração do agente, exames médicos clínicos, além de dados referentes à empresa. Adicionalmente, vale informar que a Instrução Normativa nº128 do INSS, de 2022, permite que a informação de ausência de riscos no PPP seja prestada com base na declaração de inexistência de riscos da NR-01 ou na inexistência de riscos físicos, químicos e biológicos no PGR."],[29,"Portanto, o PGR não substitui o LTCAT, nem o PPP, pois são documentos com finalidades diferentes e regulamentações diversas."],[30,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 34. Qual é o formato do PGR que deve ser disponibilizado para a fiscalização do trabalho, digital ou físico? A NR 01 não estabelece o formato específico para o PGR, podendo ser gerado em formato físico ou digital. Se adotado o meio digital, a NR 01 estabelece que o documento seja gerado no padrão Infraestrutura de Chaves Públicas Brasileira (ICP-Brasil), bem como exige garantia quanto à autenticidade, integridade, disponibilidade, rastreabilidade, irretratabilidade, privacidade e interoperabilidade:"],[30,"1.6.2 Os documentos previstos nas NR podem ser emitidos e armazenados em meio digital com certificado digital emitido no âmbito da Infraestrutura de Chaves Públicas Brasileira (ICP-Brasil), normatizada por lei específica. 1.6.4 O empregador deve garantir a preservação de todos os documentos nato digitais ou digitalizados por meio de procedimentos e tecnologias que permitam verificar, a qualquer tempo, sua validade jurídica em todo território nacional, garantindo permanentemente sua autenticidade, integridade, disponibilidade, rastreabilidade, irretratabilidade, privacidade e interoperabilidade. Ainda em caso de documento digital, a NR 01 estabelece que o empregador garanta o acesso da inspeção do trabalho a essa documentação:"],[30,"1.6.5 O empregador deve garantir à Inspeção do Trabalho amplo e irrestrito acesso a todos os documentos digitalizados ou nato digitais. 35.Posso elaborar PGR único para todas as filiais da organização que realizem uma mesma atividade? Não. A organização deve implementar o gerenciamento de risco ocupacional em cada um de seus estabelecimentos. Dentro do estabelecimento, o PGR pode ser implementado, a critério da organização, por unidade operacional, setor ou atividade."],[31,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Levantamento preliminar de perigos e identificação de perigos 36. Qual o objetivo do levantamento preliminar de perigos previsto no item 1.5.4.2 da NR 01?"],[31,"O levantamento preliminar de perigos é a primeira etapa do GRO e tem como objetivo conhecer os perigos da organização, com vistas a verificar os perigos que podem ser evitados. Se for constatado que o risco pode, de fato, ser evitado, a organização interrompe a análise, adota as medidas para eliminar o risco e não precisa proceder à etapa seguinte, que seria destinada à identificação de perigos e avaliação de riscos ocupacionais. O levantamento preliminar de perigos deve ser realizado: a) antes do início do funcionamento do estabelecimento ou novas instalações; b) para as atividades existentes; e c) nas mudanças e introdução de novos processos ou atividades de trabalho."],[31,"37. A organização deve manter evidências de que realizou o levantamento preliminar de perigos? Quais evidências devem ser mantidas? A organização deve manter evidências que realizou todos os processos do gerenciamento de risco ocupacional. Com relação ao levantamento preliminar de perigos, algumas das evidências são: • Evidências documentais de inspeções dos locais e equipamentos de trabalhos; • Evidências de que a organização realizou a consulta dos trabalhadores quanto à percepção de riscos ocupacionais; e • Monitoramento das condições ambientais e exposições a agentes nocivos, quando aplicável. 38. É possível identificar os colaboradores expostos somente por Grupo de Exposição Similar (GES), sem mencionar as funções dentro de cada um desses GES?"],[32,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho A indicação de quem está exposto ao perigo/risco pode ser individualizada ou por grupo de trabalhadores que compartilham o mesmo padrão de exposição devido à similaridade dos determinantes envolvidos, como o ambiente, o trabalho no mesmo setor, os processos e materiais que utilizam e as tarefas realizadas. Optando-se pela indicação por grupos, é importante que a documentação identifique a composição desses Grupos de Exposição Similar. 39. A identificação do perigo de forma genérica, como, por exemplo, fumos de solda e produtos químicos, é válida?"],[32,"Não. A organização deve realizar análise preliminar das atividades e dos dados relativos aos agentes físicos, químicos e biológicos, para determinar a necessidade de adoção direta de medidas de prevenção ou de realização de avaliações qualitativas ou, quando aplicáveis, quantitativas. No caso da solda, a composição do metal de base, do metal de adição e o tipo de processo de soldagem usado afetam a composição específica e a concentração encontrada nos fumos de solda, originando diferentes quantidades de fumos com várias concentrações de substâncias perigosas, como chumbo, níquel, manganês e cromo hexavalente. Cada uma dessas substâncias deve ser identificada separadamente, para cada perigo identificado deve ser estabelecido um nível de risco ocupacional. Isso resultará em diferentes estratégias de controle dos riscos e de meios para monitoramento biológico, como exames complementares. Assim, a identificação do perigo de forma genérica evidencia a má gestão do risco ocupacional no estabelecimento."],[32,"9.4.1 Deve ser realizada análise preliminar das atividades de trabalho e dos dados já disponíveis relativos aos agentes físicos, químicos e biológicos, a fim de determinar a necessidade de adoção direta de medidas de prevenção ou de realização de avaliações qualitativas ou, quando aplicáveis, de avaliações quantitativas. 9.4.2 A avaliação quantitativa das exposições ocupacionais aos agentes físicos, químicos e biológicos, quando necessária, deverá ser realizada para: a) comprovar o controle da exposição ocupacional aos agentes identificados; b) dimensionar a exposição ocupacional dos grupos de trabalhadores;"],[33,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho c) subsidiar o equacionamento das medidas de prevenção. 9.4.2.1 A avaliação quantitativa deve ser representativa da exposição ocupacional, abrangendo aspectos organizacionais e condições ambientais que envolvam o trabalhador no exercício das suas atividades. 40. Considerando que a identificação dos perigos deve abordar os perigos externos previsíveis relacionados ao trabalho que possam afetar a segurança e a saúde no trabalho, os fenômenos ambientais sazonais devem ser contemplados no GRO?"],[33,"Não. Embora os fenômenos ambientais sazonais possam afetar/interferir na execução da atividade, nesse caso, não há que se falar de risco ocupacional, e sim, de risco ambiental. 1.5.3.1.1 O gerenciamento de riscos ocupacionais deve constituir um Programa de Gerenciamento de Riscos - PGR."],[33,"Com relação aos perigos externos, importante esclarecer as duas vertentes do termo: a primeira relacionada com organizações que exercem suas atividades externas ao estabelecimento, e a segunda relacionada à área geográfica no entorno do estabelecimento da organização. A primeira acepção se refere às organizações que realizam atividades fora do estabelecimento, como por exemplo: coleta de resíduos, construção de rodovias, obras de infraestrutura para energia elétrica, telecomunicações, água, esgoto, transporte rodoviário de carga e ferroviário, dentre outros. Essas organizações, da mesma forma que consideram os perigos envolvidos em atividades realizadas dentro do estabelecimento, devem também dar atenção aos perigos resultantes das atividades externas. A outra situação está ligada aos perigos existentes no entorno do estabelecimento, que podem afetar toda organização, e são tratados como acidentes industriais maiores ou acidentes ampliados. Segundo a Convenção nº 174 da Organização Internacional do Trabalho (OIT), que trata da “Convenção sobre a prevenção de acidentes industriais maiores”, acidentes ampliados são:"],[34,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho “Todo evento inesperado, como uma emissão, um incêndio ou uma explosão de grande magnitude, envolvendo uma ou mais substâncias perigosas e que exponha aos trabalhadores, a população ou o meio ambiente a perigo de consequências imediatas ou de médio e longo prazos.”"],[34,"Portanto, cabe à organização identificar esses perigos externos previsíveis relacionados ao entorno da organização e trabalhar na redução das consequências e severidade de um acidente maior no local de trabalho, desencadeando ações de resposta de emergências, ou até mesmo, o distanciamento adequado. Esses processos variam consideravelmente de empresa para empresa, desde simples avaliações até análises complexas com grandes volumes de documentos. Cabe à organização planejar esses processos conforme suas necessidades, as situações encontradas no ambiente de trabalho, e ficar em conformidade com os requisitos legais. 41.Um risco/perigo não identificado no PGR que tenha contribuído para a ocorrência de um acidente de trabalho indica falha na gestão dos riscos ocupacionais?"],[34,"Sim. Se o perigo existia e não foi identificado, restou descumprido o item 1.5.3.2, alínea “b”, da NR 01. Nesse caso, não houve o gerenciamento do risco que gerou o acidente. O processo de gerenciamento de riscos ocupacionais deve ser dinâmico com vistas a propiciar a prevenção em segurança e saúde no trabalho, não se exaurindo apenas pela elaboração do PGR. Nesse sentido, a NR 01 prevê que o levantamento preliminar de perigos deve ser realizado de maneira abrangente: 1.5.4.2.1 O levantamento preliminar de perigos deve ser realizado: a) antes do início do funcionamento do estabelecimento ou novas instalações; b) para as atividades existentes; e c) nas mudanças e introdução de novos processos ou atividades de trabalho."],[35,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 42. Se a organização identificar um perigo conforme previsto em determinada NR e não o referenciar no PGR, este fato, por si só, representa descumprimento ao item 1.5.3.1.3 ou apenas um indício de que o gerenciamento de risco ocupacional é falho? O item 1.5.3.1.3 da NR 01 estabelece que: 1.5.3.1.3 O PGR deve contemplar ou estar integrado com planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho."],[35,"A situação ilustrada no questionamento representa, além de descumprimento ao item 1.5.3.1.3, falha do gerenciamento de risco ocupacional pela organização, uma vez que o objetivo principal desse processo é que a organização tenha um panorama completo de todas as situações de perigo de suas atividades, originadas dentro ou fora do estabelecimento, que possam afetar a saúde e segurança dos trabalhadores. Se, por exemplo, no estabelecimento há um procedimento operacional para trabalho em altura, cumprindo o que determina a Norma Regulamentadora nº 35 (NR 35), esse fato impacta a gradação da probabilidade de ocorrência das lesões ou agravos à saúde, nos termos do item 1.5.4.4.4, alínea “a”, da NR 01. Esse perigo deveria, portanto, ser contemplado no PGR, pois os requisitos estabelecidos nas normas regulamentadoras devem ser observados por ocasião da classificação do nível de risco, especificamente na gradação da probabilidade. Existe, portanto, uma lacuna, uma omissão nesse programa."],[35,"43. Quando existe um perigo, porém o risco associado seja classificado como \"0\", é necessário reconhecer o perigo no PGR? Na fase de levantamento preliminar de perigos, se for constatado que o perigo pode, de fato, ser evitado ou eliminado, a organização interrompe a análise, adota as medidas para eliminar o perigo e não precisa proceder à etapa seguinte, que seria destinada à identificação de perigos e avaliação de riscos ocupacionais. No entanto, caso o risco não possa ser evitado, mesmo que já esteja em um nível considerado “aceitável” pela organização, deve integrar o inventário de riscos."],[36,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho O inventário de riscos ocupacionais deve contemplar, nos termos do item 1.5.7.3.2 da NR 01, a descrição de perigos e de possíveis lesões ou agravos à saúde dos trabalhadores, além de dados da análise preliminar. Isso posto, e considerando que o inventário de riscos compõe o acervo mínimo do PGR, o perigo deve estar descrito no PGR. 44.Os perigos mecânicos mantidos sob controle devem constar no inventário de risco, serem avaliados e finalmente classificados por meio de uma matriz?"],[36,"Sim. Sempre que um perigo não puder ser evitado, na fase de levantamento preliminar de perigos, importa à organização o dever de implementar a identificação do perigo, avaliar e definir o nível do risco ocupacional, mesmo que o considere “sob controle”. Para definir o nível do risco ocupacional pode ser usada, por exemplo, a ferramenta da matriz de risco, também conhecida como matriz de probabilidade/consequência, que combina a probabilidade e consequência, qualitativas ou quantitativas, resultando desse cruzamento um nível de risco. Esclareça-se, contudo, que a NR 01 não determinou qual ferramenta e técnica de avaliação de riscos deve ser utilizada pela organização, estipulando apenas que seja adequada/aplicável ao risco a ser classificado. Avaliação de riscos ocupacionais"],[36,"45. Caso o perigo tenha mais de uma possível lesão ou agravo, a organização deve relacionar o perigo a cada uma das possíveis lesões ou agravos, ou pode escolher a de maior gravidade? Para fins de classificação do nível de risco, devem ser consideradas as etapas anteriores do inventário, que incluem a descrição de perigos e de possíveis lesões ou agravos à saúde dos trabalhadores, bem como a identificação das fontes ou"],[37,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho circunstâncias, descrição de riscos gerados pelos perigos, com a indicação dos grupos de trabalhadores sujeitos a esses riscos, e descrição de medidas de prevenção implementadas. 1.5.4.4.2 Para cada risco deve ser indicado o nível de risco ocupacional, determinado pela combinação da severidade das possíveis lesões ou agravos à saúde com a probabilidade ou chance de sua ocorrência. 1.5.4.4.3 A gradação da severidade das lesões ou agravos à saúde deve levar em conta a magnitude da consequência e o número de trabalhadores possivelmente afetados."],[37,"Pode-se estabelecer como regra que deve ser considerado, para fins de estabelecimento da severidade, o pior agravo/lesão para cada via de exposição/fonte/circunstância. Se um agente químico, além de ser irritante para as vias aéreas superiores, for carcinogênico se inalado, então, o nível do risco, considerada a exposição por via aérea, deveria ser estabelecido em função do câncer, evento mais severo. Se os controles implementados para o câncer forem suficientes para evitar a irritação das vias superiores, então não seriam necessárias medidas adicionais. Entretanto, se além da via de exposição respiratória, houver exposição dérmica, devem ser listados todos os agravos possíveis e considerado o mais severo para fins de classificação do risco. Possivelmente medidas preventivas distintas das previstas para a exposição respiratória serão estabelecidas. Fatores de risco ergonômicos devem ser identificados separadamente, especificando-se os agravos de acordo com a causa (fonte) e as circunstâncias, considerando a lesão de maior gravidade relacionada a cada fator de risco. Por exemplo, em relação à repetitividade de membros superiores, as lesões incapacitantes em ombro, cotovelo e punho (LER/DORT) e em relação à movimentação manual de cargas, lesões da coluna, como a hérnia de disco. Cabe ao profissional responsável pela avaliação selecionar as ferramentas mais adequadas para a avaliação dos riscos e posterior classificação em níveis de risco."],[38,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 46. Quais ferramentas e técnicas de avaliação de riscos devem ser utilizadas? Apesar de a nova NR 01 prever a realização de uma avaliação para classificação dos riscos, as ferramentas ou técnicas de avaliações não foram padronizadas, cabendo à organização selecionar as ferramentas e técnicas que sejam adequadas ao risco ou à circunstância em avaliação, nos termos do subitem 1.5.4.4.2.1 da NR 01: 1.5.4.4.2.1 A organização deve selecionar as ferramentas e técnicas de avaliação de riscos que sejam adequadas ao risco ou circunstância em avaliação."],[38,"Existem diversas ferramentas de avaliação de risco e metodologias disponíveis para ajudar as organizações a avaliarem os seus riscos ocupacionais. A escolha da técnica adequada vai depender das condições do local de trabalho, por exemplo, o número de trabalhadores, o tipo de atividades de trabalho e equipamentos, as características específicas do local de trabalho e os riscos específicos da organização. Entre as referências técnicas de avaliação de riscos, recomenda-se a leitura da norma técnica ABNT NBR IEC 31010:2021 – Gestão de Riscos – Técnicas para o processo de avaliação de riscos, que fornece orientações sobre a seleção e aplicação de técnicas sistemáticas para o processo de avaliação de riscos. Trata-se de uma norma de apoio à ABNT NBR ISO 31000:2018 - Gestão de Riscos - Diretrizes, que estabelece diretrizes para gerenciar riscos enfrentados pelas organizações. A ABNT NBR IEC 31010:2021 aborda diversas técnicas de avaliação de riscos, dentre as quais citam-se: estudos de perigo e operabilidade (HAZOP); análise de causa-consequência; matriz de probabilidade/consequência; análise de árvores de decisões; e análise por multicritérios (AMC)."],[38,"47. Pode-se usar, para uma avaliação de risco, a matriz da Norma Regulamentadora nº 03 (NR 03)? Não. De acordo com a redação do item 3.5.1 da Norma Regulamentadora nº 03 (NR 03), a metodologia de avaliação qualitativa ali prevista possui a finalidade"],[39,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho específica de caracterização de situações de grave e iminente risco pelo auditor- fiscal do trabalho. 3.5.1 A metodologia de avaliação qualitativa prevista nesta norma possui a finalidade específica de caracterização de situações de grave e iminente risco pelo Auditor-Fiscal do Trabalho, não se constituindo em metodologia padronizada para gestão de riscos pelo empregador. As ferramentas e as técnicas de avaliação de risco da NR 01 são voltadas para a gestão. Sobre referências técnicas de avaliação de riscos, recomenda-se a releitura da questão anterior. 48.Será padronizada alguma matriz de risco para as empresas?"],[39,"Não foi proposta qualquer padronização. Apesar de a NR 01 não especificar qual ferramenta ou técnica de avaliação de riscos que deve ser utilizada pela organização, para a atribuição da probabilidade, deve ser seguido no mínimo o estabelecido no item 1.5.4.4.4 da NR 01, que trata da gradação da probabilidade de ocorrência das lesões ou agravos à saúde. 1.5.4.4.4 A gradação da probabilidade de ocorrência das lesões ou agravos à saúde deve levar em conta: a) os requisitos estabelecidos em Normas Regulamentadoras; b) as medidas de prevenção implementadas; c) as exigências da atividade de trabalho; e d) a comparação do perfil de exposição ocupacional com valores de referência estabelecidos na NR-09."],[40,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho No mesmo sentido, para a atribuição da severidade, deve ser seguido, no mínimo, o estabelecido no item 1.5.4.4.3 da NR 01, que trata da gradação da severidade das lesões ou agravos à saúde: 1.5.4.4.3 A gradação da severidade das lesões ou agravos à saúde deve levar em conta a magnitude da consequência e o número de trabalhadores possivelmente afetados. 1.5.4.4.3.1 A magnitude deve levar em conta as consequências de ocorrência de acidentes ampliados."],[40,"Ou seja: há a exigência apenas dos parâmetros a serem seguidos, mas não da ferramenta a ser utilizada, tampouco da quantidade de níveis de severidade, probabilidade ou de níveis de risco ocupacional, ficando essa determinação a cargo da organização, de acordo com as características dos processos de trabalho existentes. A matriz de severidade e probabilidade é apenas uma das diversas ferramentas de avaliação de nível de risco disponíveis. 49.Qual a diferença entre o nível de risco e a avaliação de risco?"],[40,"A avaliação de risco é etapa do gerenciamento de riscos ocupacionais. A organização deve, a partir dos perigos identificados em seu estabelecimento, avaliar os riscos ocupacionais, transformando os perigos em níveis de risco ocupacional, de forma a manter informações para adoção de medidas de prevenção. Na classificação, o risco é graduado em níveis, de acordo com os critérios de probabilidade e severidade. 1.5.4.4.5 Após a avaliação, os riscos ocupacionais devem ser classificados, observado o subitem 1.5.4.4.2, para fins de identificar a necessidade de adoção de medidas de prevenção e elaboração do plano de ação. O resultado do processo de avaliação dos riscos ocupacionais é a indicação do nível de risco ocupacional para cada um dos perigos identificados."],[41,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Para a determinação desse nível de risco, deve ser utilizada metodologia e critérios para a avaliação de riscos ocupacionais. Na NR 01 foi determinado que a organização deve selecionar as ferramentas e técnicas de avaliação de riscos que sejam adequadas ao risco ou circunstância em avaliação, não pré-definindo nenhuma das diversas ferramentas de avaliação de riscos existentes. 1.5.4.4.2.1 A organização deve selecionar as ferramentas e técnicas de avaliação de riscos que sejam adequadas ao risco ou circunstância em avaliação. 50.Os resultados das avaliações quantitativas dos riscos devem constar no PGR?"],[41,"Sim. As avaliações quantitativas, quando aplicáveis, devem ser realizadas na análise preliminar e os resultados das avaliações devem ser incorporadas ao inventário de riscos do PGR. Frise-se que a significância estatística desses resultados depende do atendimento rigoroso das normas técnicas aplicáveis a cada tipo de agente. Sugere-se a leitura do Guia técnico sobre estratégia de amostragem publicado pela Fundacentro. 9.4.1 Deve ser realizada análise preliminar das atividades de trabalho e dos dados já disponíveis relativos aos agentes físicos, químicos e biológicos, a fim de determinar a necessidade de adoção direta de medidas de prevenção ou de realização de avaliações qualitativas ou, quando aplicáveis, de avaliações quantitativas."],[41,"9.4.3 Os resultados das avaliações das exposições ocupacionais aos agentes físicos, químicos e biológicos devem ser incorporados ao inventário de riscos do PGR. 51. Qual o objetivo da realização das avaliações quantitativas? Para que servem?"],[42,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Conforme consta no item 9.4.2 da NR 09, a avaliação quantitativa das exposições ocupacionais aos agentes físicos, químicos e biológicos, quando necessária, deve ser realizada para: a) comprovar o controle da exposição ocupacional aos agentes identificados; b) dimensionar a exposição ocupacional dos grupos de trabalhadores; e c) subsidiar o equacionamento das medidas de prevenção. 52. Caso a avaliação quantitativa, por exemplo, de sílica, tenha como resultado \"não detectado”, este agente precisará estar presente no PGR?"],[42,"Sim. Todas as vezes que o perigo for identificado, na fase de levantamento preliminar de perigos, e o risco não puder ser evitado com a eliminação do perigo, a organização deve implementar o processo de identificação de perigos e avaliação de riscos ocupacionais dando sequência nos outros processos do gerenciamento de risco ocupacional. No caso concreto, ainda que “não detectada” sílica na avaliação quantitativa, as evidências documentais da adequada gestão desse risco ocupacional devem ser preservadas, visto que o perigo foi constatado na fase de levantamento preliminar de perigos. O inventário de riscos ocupacionais deve contemplar, nos termos do item 1.5.7.3.2 da NR 01, a descrição de perigos e de possíveis lesões ou agravos à saúde dos trabalhadores, além de dados do monitoramento das exposições a agentes químicos, de que é exemplo a sílica. Isso posto, e considerando que o inventário de riscos compõe o acervo mínimo do PGR, o perigo deve estar descrito no PGR."],[42,"53.O médico do trabalho também deve avaliar os ambientes de trabalho caso a avaliação dos riscos esteja errada? Sim. Caso o médico responsável pelo Programa Médico de Saúde Ocupacional (PCMSO) observe inconsistências no inventário de riscos da organização, deverá reavaliá-las em conjunto com os responsáveis pelo PGR."],[43,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 7.5.5 O médico responsável pelo PCMSO, caso observe inconsistências no inventário de riscos da organização, deve reavaliá-las em conjunto com os responsáveis pelo PGR. 54. Quem já usa o HAZOP como ferramenta para gerenciamento e análise de riscos pode realizar a migração das informações para uma matriz de riscos?"],[43,"Sim. A matriz de riscos é uma das ferramentas e técnicas que pode ser utilizada para a avaliação do risco, uma vez que o HAZOP visa identificar os perigos e problemas de operabilidade na instalação de um processo. Destaca-se que a NR 01 não determinou qual ferramenta e técnica de avaliação de riscos deve ser utilizada pela organização, estipulando apenas que seja adequada/aplicável ao risco a ser classificado e que seja apresentado o nível de risco. Controle dos riscos (medidas de prevenção) 55. As medidas de prevenção a serem introduzidas, aprimoradas ou mantidas, indicadas no plano de ação, devem estar relacionadas necessariamente com os riscos avaliados?"],[43,"Sim. As medidas de prevenção são implementadas de acordo com a classificação de risco, indicadas e relacionadas no plano de ação, considerada a ordem de prioridade estabelecida no item 1.4.1, alínea “g”, da NR 01: g) implementar medidas de prevenção, ouvidos os trabalhadores, de acordo com a seguinte ordem de prioridade: I. eliminação dos fatores de risco; II. minimização e controle dos fatores de risco, com a adoção de medidas de proteção coletiva;"],[44,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho III. minimização e controle dos fatores de risco, com a adoção de medidas administrativas ou de organização do trabalho; e IV. adoção de medidas de proteção individual. Assim, para cada risco identificado e classificado devem ser indicadas as medidas de controle específicas, demonstrando-se a observância à hierarquia de medidas:"],[44,"1.5.5.1.2 Quando comprovada pela organização a inviabilidade técnica da adoção de medidas de proteção coletiva, ou quando estas não forem suficientes ou encontrarem-se em fase de estudo, planejamento ou implantação ou, ainda, em caráter complementar ou emergencial, deverão ser adotadas outras medidas, obedecendo-se a seguinte hierarquia: a) medidas de caráter administrativo ou de organização do trabalho; b) utilização de equipamento de proteção individual - EPI. 56. Como a organização deve demonstrar a melhoria contínua em SST?"],[44,"A NR 01 estabelece que o desempenho das medidas de prevenção deve ser acompanhado de forma planejada, sendo que as medidas de prevenção devem ser ajustadas quando os dados obtidos no acompanhamento indicarem ineficácia em seu desempenho. Além disso, cabe à organização a adoção de medidas necessárias para melhorar seu desempenho em SST. Se um sistema de ventilação local exaustora, por exemplo, foi planejado como medida de prevenção, seu desempenho para a redução da concentração de contaminantes no posto de trabalho deve ser examinado. A partir da análise da eficácia, podem ser propostas medidas de ajuste que melhorem seu desempenho, com o redimensionamento do controle, como mudanças na velocidade/vazão, altura de captura etc. Indicadores como redução da frequência e gravidade de acidentes, ampliação das análises de incidentes e a realização de avaliação de aprendizado após capacitações evidenciam o esforço empresarial para a melhoria contínua dos níveis de segurança e saúde no trabalho."],[45,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 57. Quando o perigo está sob controle, é necessário o registro e controle das medidas de prevenção?"],[45,"Sim. As medidas de prevenção são implementadas de acordo com a classificação de risco. Quando na fase de levantamento preliminar de perigos o risco não puder ser evitado, com a eliminação do perigo, a organização deve implementar o processo de identificação de perigos e avaliação de riscos ocupacionais dando sequência nos outros processos do gerenciamento de risco ocupacional. Nos termos do item 1.5.4.4.5 da NR 01, se, após a avaliação e classificação dos riscos ocupacionais, forem desnecessárias medidas de prevenção, não será elaborado, relativamente a esses riscos, uma proposta de plano de ação. Interrompe-se o processo de documentação do gerenciamento do risco ocupacional nesse momento. Preparação para emergências 58. O Plano de Resposta a Emergências (PRE) deve estar dentro do PGR?"],[45,"Não deve estar dentro do PGR, pois não é considerado como uma medida de prevenção. Assim, deve estar contemplado em documento separado e ser desenvolvido de forma individualizada de acordo com os riscos ocupacionais existentes na organização e identificados e classificados no inventário de riscos. Isso vale também para o registro de análises de acidentes e doenças do trabalho. Por não se tratar de uma ação prevencionista, não deve estar dentro do PGR, mas sim fornecer subsídios para a proposição de melhorias no processo de gerenciamento de riscos ocupacionais."],[45,"59. O Plano de Preparação para Emergências (PRE) é considerado uma medida de prevenção pela NR 01, devendo estar contemplado no inventário de risco e no plano de ação? O cronograma de exercícios simulados do PRE da organização deve estar contemplado no plano de ação do PGR?"],[46,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Não. O item 1.5.6 da NR 01, que trata da preparação para emergências, indica que a organização deve realizar uma análise de cenários possíveis de emergência e implementar e manter procedimentos de respostas, sem prejuízo da aplicação dos dispositivos de outras NR. Dessa forma, o mero atendimento à Norma Regulamentadora nº 23 (NR 23) não exime a organização de elaborar os referidos procedimentos de respostas a emergências conforme a NR 01. 1.5.6 Preparação para emergências"],[46,"1.5.6.1 A organização deve estabelecer, implementar e manter procedimentos de respostas aos cenários de emergências, de acordo com os riscos, as características e as circunstâncias das atividades. 1.5.6.2 Os procedimentos de respostas aos cenários de emergências devem prever: a) os meios e recursos necessários para os primeiros socorros, encaminhamento de acidentados e abandono; e b) as medidas necessárias para os cenários de emergências de grande magnitude, quando aplicável. Quanto aos registros e documentações desses procedimentos de respostas a emergências, tem-se que toda documentação relativa deve estar na organização de forma rastreável e organizada para que possa integrar o sistema de gerenciamento de riscos ocupacionais, no entanto, sem integrar o PGR."],[46,"Documentação, evidências e registros 60. O inventário de riscos é um documento à parte ou deve ser acoplado ao PGR? O inventário de risco deve fazer parte/estar contido no PGR, conforme previsão expressa da NR 01."],[47,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho 1.5.7.1 O PGR deve conter, no mínimo, os seguintes documentos: a) inventário de riscos; e 61. Pode-se utilizar uma planilha de perigo e risco enquanto inventário de riscos, como documento anexo? Sim. Como não há um formato normatizado para apresentação documental do inventário de riscos ocupacionais, as organizações podem apresentá-lo em diversos formatos, sendo comum uma planilha de perigos e riscos que contemple todas as etapas discriminadas na NR 01 e respectivos conteúdos mínimos. 62. Com relação à atualização do inventário de riscos, a organização terá que fazer um novo documento ou somente criar um anexo para o inventário?"],[47,"As organizações podem apresentar esse documento em diversos formatos, já que não há uma regra estabelecida pela NR 01, sendo mais comum a elaboração de uma planilha de perigos e riscos, a qual deve ser atualizada constantemente refletindo a realidade da empresa. As sucessivas versões devem ser preservadas em meio físico ou digital. Deve ser sempre disponibilizada a versão atualizada do documento, atendendo integralmente à NR 01, sendo mantido o acesso às versões já ultrapassadas. Note- se que, quando da atualização do inventário de riscos, todas as etapas precisam ser atualizadas, sendo necessária também a atualização do plano de ação. 1.5.7.3.3 O inventário de riscos ocupacionais deve ser mantido atualizado."],[47,"1.5.7.3.3.1 O histórico das atualizações deve ser mantido por um período mínimo de 20 (vinte) anos ou pelo período estabelecido em normatização específica. 63. Laudos técnicos de insalubridade e periculosidade devem constar no PGR?"],[48,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Não, pois o PGR deve ser utilizado para fins de prevenção e gerenciamento dos riscos ocupacionais. O PGR não deve ser utilizado para fins de caracterização de atividades ou operações insalubres ou perigosas, conforme prevê expressamente o item 1.5.2 da NR 01. 1.5.2 Para fins de caracterização de atividades ou operações insalubres ou perigosas, devem ser aplicadas as disposições previstas na NR-15 – Atividades e operações insalubres e NR-16 – Atividades e operações perigosas. As referidas normas estabelecem quais atividades são consideradas insalubres ou perigosas e definem os critérios específicos para a correspondente caracterização."],[48,"64. O PGR deve abranger o plano de combate a incêndio e seus riscos? O PGR é a materialização da documentação relativa ao gerenciamento de riscos ocupacionais, contendo, no mínimo, o inventário de riscos e o plano de ação, conforme o item 1.5.7 da NR 01: 1.5.7.1 O PGR deve conter, no mínimo, os seguintes documentos: a) inventário de riscos; e O plano de combate a incêndio enquadra-se na NR 23 e deve atender à legislação estadual: 23.1 Todos os empregadores devem adotar medidas de prevenção de incêndios, em conformidade com a legislação estadual e as normas técnicas aplicáveis."],[49,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho"],[49,"Dessa forma, a documentação relativa tanto à adequação e projeto do sistema de combate a incêndio quanto da aprovação pela autoridade estadual, por exemplo, Corpo de Bombeiros, deve estar na organização de forma rastreável e organizada para que possa integrar o sistema de gerenciamento de riscos ocupacionais. Entretanto, conforme previsto na própria NR 23, há ali outros itens cujos descumprimentos podem ser entendidos tanto como riscos ocupacionais quanto como aspectos de desconformidade. Logo, a depender da realidade do local e do nível de risco apurado, essas medidas da norma (de prevenção ou de conformidade) devem ser objeto de plano de ação, com indicação de prazos específicos, meios de acompanhamento e aferição de resultados. A exemplo, citam-se os itens:"],[49,"23.3 As aberturas, saídas e vias de passagem devem ser claramente assinaladas por meio de placas ou sinais luminosos, indicando a direção da saída. 23.4 Nenhuma saída de emergência deverá ser fechada à chave ou presa durante a jornada de trabalho. 23.5 As saídas de emergência podem ser equipadas com dispositivos de travamento que permitam fácil abertura do interior do estabelecimento. 65. Quais evidências e registros a organização deve manter quanto à gestão de risco ocupacional, em atendimento às questões legais? • Se os resultados dos processos de identificação de perigos ou situações de fatores de risco e análise dos riscos ocupacionais foram realizados;"],[49,"• Se os controles de riscos foram implementados pelo plano de ação e se são eficazes, isto é, se há comprovação de que atendem às finalidades propostas; • Se os meios de consulta, comunicação, treinamento para os trabalhadores e contratados são eficazes e estão sendo registrados;"],[50,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho • Se estão sendo coletadas e usadas informações que possam ser úteis para rever e/ou melhorar aspectos do gerenciamento de risco ocupacional; • Se os requisitos legais de outras NR e da legislação de segurança e saúde no trabalho estão sendo atendidos; • Se estão sendo realizadas inspeções sistemáticas no local de trabalho, utilizando listas de verificação (checklists); • Se estão sendo realizadas as ações de saúde ocupacional; • Se existe a avaliação preliminar de novas instalações, equipamentos, materiais, produtos químicos, tecnologias, processos, procedimentos e padrões de trabalho;"],[50,"• Se estão sendo realizadas inspeções de maquinário e instalações específicas para verificar se as peças de segurança estão adequadamente ajustadas e em boas condições. • Se estão sendo realizadas amostragens ambientais: medição da exposição a produtos químicos, agentes biológicos ou físicos e comparação com os padrões reconhecidos; • Se os documentos e registros estão atualizados e armazenados; e • Se existe gestão das empresas contratadas. 66. Quais exemplos de evidências a organização deve documentar com relação à consulta e à comunicação entre a organização e seus trabalhadores sobre os assuntos referentes à SST? As evidências dessa consulta e comunicação podem ser:"],[51,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho • Comunicados sobre SST para trabalhadores, contratadas ou visitantes; • Quadros de aviso contendo dados de desempenho em saúde e segurança, bem como outras informações pertinentes; • Boletim informativo sobre saúde ocupacional e segurança; • Cartazes, e-mails, folders, entre outros meios de comunicação; • Semana Interna de Prevenção de Acidentes do Trabalho (SIPAT); e • Campanha de Prevenção de Acidentes do Trabalho (CANPAT). 67. Como a empresa irá comprovar que os trabalhadores foram ouvidos, conforme preconiza o item 1.4.1, alínea \"g” da NR 01?"],[51,"As atas de reuniões da Comissão Interna de Prevenção de Acidentes (CIPA) são uma das formas de comprovar que os trabalhadores foram ouvidos na implementação das medidas de prevenção, uma vez que faz parte da atribuição da CIPA acompanhar o processo de identificação de perigos e avaliação de riscos bem como a adoção de medidas de prevenção implementadas pela organização:"],[51,"NR 01 1.4.1 Cabe ao empregador: (...) g) implementar medidas de prevenção, ouvidos os trabalhadores, de acordo com a seguinte ordem de prioridade: I. eliminação dos fatores de risco; II. minimização e controle dos fatores de risco, com a adoção de medidas de proteção coletiva; III. minimização e controle dos fatores de risco, com a adoção de medidas administrativas ou de organização do trabalho; e IV. adoção de medidas de proteção individual. NR 05 5.3.1 A CIPA tem por atribuição: a) acompanhar o processo de identificação de perigos e avaliação de riscos bem como a adoção de medidas de prevenção implementadas pela organização; (...)"],[52,"MINISTÉRIO DO TRABALHO E PREVIDÊNCIA Secretaria de Trabalho Subsecretaria de Inspeção do Trabalho Coordenação-Geral de Segurança e Saúde no Trabalho Caso a organização não tenha CIPA constituída, suas funções devem ser desempenhadas pelo nomeado. No entanto, cabe à organização eleger a forma mais adequada de realizar essa consulta e realizar os registros necessários. 68. É necessário descrever no inventário de riscos todos os riscos identificados nos diversos programas da organização (Análise Ergonômica do Trabalho (AET), NR 12, NR 10, Programa de Proteção Respiratória (PPR), etc.), ou pode-se apenas referenciar a existência desses documentos?"],[52,"Sim, todos os riscos devem estar consolidados no inventário, observado o conteúdo mínimo estabelecido no item 1.5.7.3.2 da NR 01. Relativamente aos riscos classificados, deve estar associado um plano de ação, indicando as medidas de prevenção a serem introduzidas, aprimoradas ou mantidas, acompanhado de cronograma, formas de acompanhamento e aferição de resultados. O PGR pode contemplar todos os documentos previstos nas outras NR em \"um só documento\" ou pode fazer remissão/estar integrado com planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho. 1.5.3.1.3 O PGR deve contemplar ou estar integrado com planos, programas e outros documentos previstos na legislação de segurança e saúde no trabalho."],[52,"69. A definição de p
